<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blitz-Tipper — Retro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000; --panel: #171a1a; --ink: #f9f9f9; --ink-dim: #a9a9a9;
    --accent: #6a00e0; --accent-light: #a951ed; --gold: #ff33a7; --teal: #00ff74;
  }
  * { box-sizing: border-box; }
  @keyframes targetPop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes targetGlow {
    0%, 100% { box-shadow: 3px 3px 0 #000, 0 0 10px 2px currentColor; }
    50% { box-shadow: 3px 3px 0 #000, 0 0 20px 6px currentColor; }
  }
  @keyframes scoreBump {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  @keyframes timerUrgent {
    0%, 100% { color: var(--gold); text-shadow: 0 0 8px rgba(255,51,167,0.7); }
    50% { color: #ff5050; text-shadow: 0 0 16px rgba(255,80,80,0.9); }
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.8); opacity: 1; }
    100% { transform: translateY(-40px) scale(1.1); opacity: 0; }
  }
  @keyframes flashScreen {
    0% { background: rgba(0,255,116,0.18); }
    100% { background: rgba(0,255,116,0); }
  }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 8px var(--gold), 0 0 20px rgba(255,51,167,0.7); }
    50% { text-shadow: 0 0 14px var(--gold), 0 0 32px rgba(255,51,167,1); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(60vh) rotate(540deg); opacity: 0; }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Roboto Mono', monospace; height: 100vh; overflow: hidden; }
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 150px 14px 18px; font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 14px;
    position: relative; z-index: 3;
  }
  .hud .score { color: var(--teal); text-shadow: 0 0 8px rgba(0,255,116,0.7); display: inline-block; }
  .hud .score.bump { animation: scoreBump 0.3s ease; }
  .hud .timer { color: var(--gold); text-shadow: 0 0 8px rgba(255,51,167,0.6); }
  .hud .timer.urgent { animation: timerUrgent 0.6s ease-in-out infinite; }
  .arena {
    position: relative; width: 100%; height: calc(100vh - 56px); overflow: hidden;
    background:
      linear-gradient(0deg, transparent 24%, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.04) 26%, transparent 27%, transparent 74%, rgba(255,255,255,0.04) 75%, rgba(255,255,255,0.04) 76%, transparent 77%),
      linear-gradient(90deg, transparent 24%, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.04) 26%, transparent 27%, transparent 74%, rgba(255,255,255,0.04) 75%, rgba(255,255,255,0.04) 76%, transparent 77%),
      radial-gradient(circle at 50% 50%, rgba(106,0,224,0.15), transparent 60%);
    background-size: 40px 40px, 40px 40px, 100% 100%;
  }
  .target {
    position: absolute; width: 46px; height: 46px; border-radius: 8px;
    border: 3px solid var(--ink); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff;
    animation: targetPop 0.25s cubic-bezier(.3,1.6,.4,1), targetGlow 1s ease-in-out infinite;
  }
  .flash-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .flash-overlay.hit { animation: flashScreen 0.25s ease-out; }
  .float-pop {
    position: absolute; pointer-events: none; font-weight: 700; font-size: 15px; color: var(--teal);
    text-shadow: 0 0 8px rgba(0,255,116,0.8); animation: floatUp 0.6s ease-out forwards; z-index: 4;
  }
  .start-overlay {
    position: absolute; inset: 0; background: rgba(10,5,20,0.9); z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .start-overlay h1 { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 28px; color: var(--gold); margin: 0; letter-spacing: 1px; animation: titleGlow 2.5s ease-in-out infinite; }
  .start-overlay p { color: var(--ink-dim); font-size: 17px; margin: 0; text-align: center; padding: 0 20px; }
  .start-btn {
    padding: 12px 24px; background: var(--accent); color: #fff; border: 3px solid var(--ink);
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 14px; cursor: pointer;
    box-shadow: 4px 4px 0 #000, 0 0 16px 2px rgba(106,0,224,0.7);
  }
  .start-btn:hover { background: var(--accent-light); }
  .start-btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 #000; }
  .confetti-piece { position: absolute; top: 0; width: 8px; height: 8px; pointer-events: none; animation: confettiFall 1.6s ease-in forwards; z-index: 6; }
</style>
</head>
<body>
<div class="hud">
  <span class="score" id="score">PUNKTE: 0</span>
  <span class="timer" id="timer">ZEIT: 20</span>
</div>
<div class="arena" id="arena">
  <div class="flash-overlay" id="flash"></div>
  <div class="start-overlay" id="start-overlay">
    <h1>BLITZ-TIPPER</h1>
    <p>Tippe so viele Ziele wie möglich in 20 Sekunden</p>
    <button class="start-btn" id="start-btn">START</button>
  </div>
</div>
<script>
(function(){
  const arena = document.getElementById('arena');
  const flash = document.getElementById('flash');
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  const startOverlay = document.getElementById('start-overlay');
  const startBtn = document.getElementById('start-btn');
  const targetColors = ['#6a00e0', '#a951ed', '#ff33a7', '#00ff74'];

  let score = 0, timeLeft = 20, running = false, countdownTimer = null;
  let currentTarget = null, lastHitTime = 0, combo = 0;

  let actx = null;
  function beep(freq, dur, type) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(); osc.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  function sfxHit(combo) { beep(440 + combo * 40, 0.09, 'square'); }
  function sfxTick() { beep(880, 0.05, 'square'); }
  function sfxEnd() { [392, 523, 659].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'triangle'), i * 90)); }

  const confettiColors = ['#ff33a7', '#a951ed', '#00ff74', '#6a00e0', '#f9f9f9'];
  function burstConfetti(count) {
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.background = confettiColors[i % confettiColors.length];
      piece.style.animationDelay = (Math.random() * 0.3) + 's';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      arena.appendChild(piece);
      setTimeout(() => piece.remove(), 2000);
    }
  }

  function bumpScore() {
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
  }

  function floatPop(x, y, text) {
    const el = document.createElement('div');
    el.className = 'float-pop';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    arena.appendChild(el);
    setTimeout(() => el.remove(), 650);
  }

  function spawnTarget() {
    if (currentTarget) currentTarget.remove();
    const target = document.createElement('div');
    target.className = 'target';
    target.textContent = '★';
    const color = targetColors[Math.floor(Math.random() * targetColors.length)];
    target.style.background = color;
    target.style.color = color;
    const size = 46 - Math.min(16, Math.floor(score / 3));
    target.style.width = size + 'px';
    target.style.height = size + 'px';
    const w = arena.clientWidth, h = arena.clientHeight;
    const x = Math.random() * (w - size - 12) + 6;
    const y = Math.random() * (h - size - 12) + 6;
    target.style.left = x + 'px';
    target.style.top = y + 'px';
    target.addEventListener('click', (e) => {
      const now = performance.now();
      combo = (now - lastHitTime < 900) ? combo + 1 : 1;
      lastHitTime = now;
      score++;
      scoreEl.textContent = `PUNKTE: ${score}`;
      bumpScore();
      sfxHit(Math.min(combo, 8));
      floatPop(x + size / 2 - 10, y, combo > 1 ? `+1 x${combo}` : '+1');
      flash.classList.remove('hit'); void flash.offsetWidth; flash.classList.add('hit');
      spawnTarget();
    });
    arena.appendChild(target);
    currentTarget = target;
  }

  function startGame() {
    score = 0; timeLeft = 20; running = true; combo = 0; lastHitTime = 0;
    scoreEl.textContent = 'PUNKTE: 0';
    timerEl.textContent = 'ZEIT: 20';
    timerEl.classList.remove('urgent');
    startOverlay.style.display = 'none';
    spawnTarget();
    countdownTimer = setInterval(() => {
      timeLeft--;
      timerEl.textContent = `ZEIT: ${timeLeft}`;
      if (timeLeft <= 5 && timeLeft > 0) { timerEl.classList.add('urgent'); sfxTick(); }
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    running = false;
    clearInterval(countdownTimer);
    timerEl.classList.remove('urgent');
    if (currentTarget) { currentTarget.remove(); currentTarget = null; }
    const great = score >= 15;
    startOverlay.innerHTML = `
      <h1>ZEIT UM!</h1>
      <p>Du hast ${score} Ziele getroffen</p>
      <button class="start-btn" id="restart-btn">NOCHMAL</button>
    `;
    startOverlay.style.display = 'flex';
    sfxEnd();
    if (great) burstConfetti(24);
    document.getElementById('restart-btn').addEventListener('click', startGame);
  }

  startBtn.addEventListener('click', startGame);
})();
</script>
<button id="fs-toggle-btn" type="button" aria-label="Vollbild umschalten">⛶ MAXIMIEREN</button>
<style>
  #fs-toggle-btn {
    position: fixed; top: 10px; right: 10px; z-index: 9999;
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 11px; line-height: 1;
    padding: 9px 11px; background: #171a1a; color: #a951ed;
    border: 2px solid #a951ed; box-shadow: 3px 3px 0 #000; cursor: pointer;
    white-space: nowrap;
  }
  #fs-toggle-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #000; }
  #fs-toggle-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<script>
(function(){
  var btn = document.getElementById('fs-toggle-btn');
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function updateBtn(){ btn.textContent = isFs() ? '× VERLASSEN' : '⛶ MAXIMIEREN'; }
  btn.addEventListener('click', function(){
    if (!isFs()) {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  });
  document.addEventListener('fullscreenchange', updateBtn);
  document.addEventListener('webkitfullscreenchange', updateBtn);
  updateBtn();
})();
</script>
</body>
</html>
