<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lücken-Füller — Retro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0a1e; --panel: #1a1440; --panel-light: #2c2260;
    --ink: #f2eee0; --ink-dim: #a79fd6; --accent: #ff4d6d; --gold: #ffd23f; --teal: #2ec4a6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: 'VT323', monospace; display: flex; align-items: center; justify-content: center;
  }
  .card {
    max-width: 480px; width: 100%; margin: 20px; background: var(--panel);
    border: 4px solid var(--ink); box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px var(--ink), 8px 8px 0 8px rgba(0,0,0,0.5);
    padding: 26px 24px;
  }
  h1 { font-family: 'Press Start 2P', monospace; font-size: 14px; color: var(--gold); text-align: center; margin: 0 0 18px; }
  .sentence { font-size: 19px; line-height: 2.1; margin-bottom: 22px; }
  select {
    font-family: 'VT323', monospace; font-size: 17px; background: var(--panel-light); color: var(--ink);
    border: 2px solid var(--ink); padding: 2px 8px; margin: 0 2px;
  }
  select.correct { border-color: var(--teal); }
  select.wrong { border-color: var(--accent); }
  .check-btn {
    width: 100%; padding: 12px; background: var(--accent); color: #fff; border: 3px solid var(--ink);
    font-family: 'Press Start 2P', monospace; font-size: 11px; cursor: pointer; box-shadow: 4px 4px 0 #000;
  }
  .check-btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 #000; }
  .result { text-align: center; margin-top: 14px; font-size: 17px; color: var(--gold); min-height: 22px; }
</style>
</head>
<body>
<div class="card">
  <h1>LÜCKEN-FÜLLER</h1>
  <div class="sentence" id="sentence"></div>
  <button class="check-btn" id="check-btn">PRÜFEN</button>
  <p class="result" id="result"></p>
</div>
<script>
(function(){
  const blanks = [
    { options: ['Plastik', 'Papier', 'Glas'], answer: 'Glas' },
    { options: ['Kompost', 'Restmüll', 'Sondermüll'], answer: 'Kompost' },
    { options: ['weniger', 'mehr', 'gleich viel'], answer: 'weniger' }
  ];

  const template = (parts) => `
    Küchenabfälle gehören in den ${parts[0]}-Behälter, während Altglas separat in den
    ${parts[1]}-Container gehört. Wer Produkte wiederverwendet statt wegwirft, erzeugt
    ${parts[2]} Müll im Jahr.
  `;

  const sentenceEl = document.getElementById('sentence');

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function render() {
    sentenceEl.innerHTML = 'Küchenabfälle gehören in den <span id="b0"></span>-Behälter, ' +
      'während Altglas separat in den <span id="b1"></span>-Container gehört. ' +
      'Wer Produkte wiederverwendet statt wegwirft, erzeugt <span id="b2"></span> Müll im Jahr.';

    blanks.forEach((b, i) => {
      const select = document.createElement('select');
      select.id = 'select-' + i;
      shuffle(b.options).forEach((opt) => {
        const o = document.createElement('option');
        o.value = opt; o.textContent = opt;
        select.appendChild(o);
      });
      document.getElementById('b' + i).replaceWith(select);
    });
  }
  render();

  document.getElementById('check-btn').addEventListener('click', () => {
    let correct = 0;
    blanks.forEach((b, i) => {
      const select = document.getElementById('select-' + i);
      select.classList.remove('correct', 'wrong');
      if (select.value === b.answer) {
        select.classList.add('correct');
        correct++;
      } else {
        select.classList.add('wrong');
      }
    });
    document.getElementById('result').textContent = `${correct} von ${blanks.length} richtig`;
  });
})();
</script>
</body>
</html>
