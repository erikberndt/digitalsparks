<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lücken-Füller — Retro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000; --panel: #171a1a; --panel-light: #23282a;
    --ink: #f9f9f9; --ink-dim: #a9a9a9; --accent: #6a00e0; --accent-light: #a951ed; --gold: #ff33a7; --teal: #00ff74;
  }
  * { box-sizing: border-box; }
  @keyframes bgPulse {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes borderGlow {
    0%, 100% { box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px var(--teal), 0 0 22px 3px rgba(0,255,116,0.5), 8px 8px 0 8px rgba(0,0,0,0.5); }
    50% { box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px var(--accent-light), 0 0 30px 6px rgba(169,81,237,0.55), 8px 8px 0 8px rgba(0,0,0,0.5); }
  }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 6px var(--gold), 0 0 16px rgba(255,51,167,0.6); }
    50% { text-shadow: 0 0 10px var(--gold), 0 0 26px rgba(255,51,167,0.9); }
  }
  @keyframes correctPulse {
    0% { box-shadow: 0 0 0 0 rgba(0,255,116,0.8); }
    100% { box-shadow: 0 0 16px 4px rgba(0,255,116,0); }
  }
  @keyframes shakeX {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(360px) rotate(540deg); opacity: 0; }
  }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(0,255,116,0.2), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(106,0,224,0.3), transparent 45%),
      linear-gradient(120deg, #000000, #0d0518, #000000);
    background-size: 200% 200%;
    animation: bgPulse 13s ease infinite;
    color: var(--ink); font-family: 'Roboto Mono', monospace;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card {
    position: relative;
    max-width: 480px; width: 100%; margin: 20px; background: var(--panel);
    border: 4px solid var(--ink); animation: borderGlow 3.4s ease-in-out infinite;
    padding: 26px 24px; overflow: hidden;
  }
  h1 { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 22px; color: var(--gold); text-align: center; margin: 0 0 18px; letter-spacing: 1px; animation: titleGlow 3s ease-in-out infinite; }
  .sentence { font-size: 19px; line-height: 2.3; margin-bottom: 22px; }
  select {
    font-family: 'Roboto Mono', monospace; font-size: 16px; background: var(--panel-light); color: var(--ink);
    border: 2px solid var(--ink); padding: 3px 8px; margin: 0 2px; cursor: pointer;
    transition: box-shadow 0.15s, border-color 0.15s, transform 0.15s;
  }
  select:hover, select:focus { border-color: var(--accent-light); box-shadow: 0 0 10px 1px rgba(169,81,237,0.6); outline: none; }
  select.correct { border-color: var(--teal); animation: correctPulse 0.6s ease; }
  select.wrong { border-color: var(--gold); animation: shakeX 0.4s ease; }
  .check-btn {
    width: 100%; padding: 12px; background: var(--accent); color: #fff; border: 3px solid var(--ink);
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 13px; cursor: pointer;
    box-shadow: 4px 4px 0 #000, 0 0 14px 1px rgba(106,0,224,0.7);
  }
  .check-btn:hover { background: var(--accent-light); }
  .check-btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 #000; }
  .result { text-align: center; margin-top: 14px; font-size: 17px; color: var(--gold); min-height: 22px; text-shadow: 0 0 10px rgba(255,51,167,0.6); }
  .confetti-piece { position: absolute; top: 0; width: 8px; height: 8px; pointer-events: none; animation: confettiFall 1.4s ease-in forwards; z-index: 5; }
</style>
</head>
<body>
<div class="card" id="card">
  <h1>LÜCKEN-FÜLLER</h1>
  <div class="sentence" id="sentence"></div>
  <button class="check-btn" id="check-btn">PRÜFEN</button>
  <p class="result" id="result"></p>
</div>
<script>
(function(){
  const blanks = [
    { options: ['Plastik', 'Papier', 'Glas'], answer: 'Glas' },
    { options: ['Kompost', 'Restmüll', 'Sondermüll'], answer: 'Kompost' },
    { options: ['weniger', 'mehr', 'gleich viel'], answer: 'weniger' }
  ];

  const card = document.getElementById('card');
  const sentenceEl = document.getElementById('sentence');

  let actx = null;
  function beep(freq, dur, type) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(); osc.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  function sfxWin() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square'), i * 100)); }
  function sfxPartial() { beep(660, 0.12, 'square'); }
  function sfxMiss() { beep(160, 0.24, 'sawtooth'); }

  const confettiColors = ['#ff33a7', '#a951ed', '#00ff74', '#6a00e0', '#f9f9f9'];
  function burstConfetti(count) {
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.background = confettiColors[i % confettiColors.length];
      piece.style.animationDelay = (Math.random() * 0.2) + 's';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      card.appendChild(piece);
      setTimeout(() => piece.remove(), 1700);
    }
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function render() {
    sentenceEl.innerHTML = 'Küchenabfälle gehören in den <span id="b0"></span>-Behälter, ' +
      'während Altglas separat in den <span id="b1"></span>-Container gehört. ' +
      'Wer Produkte wiederverwendet statt wegwirft, erzeugt <span id="b2"></span> Müll im Jahr.';

    blanks.forEach((b, i) => {
      const select = document.createElement('select');
      select.id = 'select-' + i;
      shuffle(b.options).forEach((opt) => {
        const o = document.createElement('option');
        o.value = opt; o.textContent = opt;
        select.appendChild(o);
      });
      select.addEventListener('change', () => select.classList.remove('correct', 'wrong'));
      document.getElementById('b' + i).replaceWith(select);
    });
  }
  render();

  document.getElementById('check-btn').addEventListener('click', () => {
    let correct = 0;
    blanks.forEach((b, i) => {
      const select = document.getElementById('select-' + i);
      select.classList.remove('correct', 'wrong');
      void select.offsetWidth;
      if (select.value === b.answer) {
        select.classList.add('correct');
        correct++;
      } else {
        select.classList.add('wrong');
      }
    });
    document.getElementById('result').textContent = `${correct} von ${blanks.length} richtig`;
    if (correct === blanks.length) { sfxWin(); burstConfetti(24); }
    else if (correct > 0) { sfxPartial(); }
    else { sfxMiss(); }
  });
})();
</script>
<button id="fs-toggle-btn" type="button" aria-label="Vollbild umschalten">⛶ MAXIMIEREN</button>
<style>
  #fs-toggle-btn {
    position: fixed; top: 10px; right: 10px; z-index: 9999;
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 11px; line-height: 1;
    padding: 9px 11px; background: #171a1a; color: #a951ed;
    border: 2px solid #a951ed; box-shadow: 3px 3px 0 #000; cursor: pointer;
    white-space: nowrap;
  }
  #fs-toggle-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #000; }
  #fs-toggle-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<script>
(function(){
  var btn = document.getElementById('fs-toggle-btn');
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function updateBtn(){ btn.textContent = isFs() ? '× VERLASSEN' : '⛶ MAXIMIEREN'; }
  btn.addEventListener('click', function(){
    if (!isFs()) {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  });
  document.addEventListener('fullscreenchange', updateBtn);
  document.addEventListener('webkitfullscreenchange', updateBtn);
  updateBtn();
})();
</script>
</body>
</html>
