<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merk-Paare — Retro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000; --panel: #171a1a; --panel-light: #23282a;
    --ink: #f9f9f9; --ink-dim: #a9a9a9; --accent: #6a00e0; --accent-light: #a951ed; --gold: #ff33a7; --teal: #00ff74;
  }
  * { box-sizing: border-box; }
  @keyframes bgPulse {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 6px var(--gold), 0 0 16px rgba(255,51,167,0.6); }
    50% { text-shadow: 0 0 10px var(--gold), 0 0 26px rgba(255,51,167,0.9); }
  }
  @keyframes matchPulse {
    0% { box-shadow: 0 0 0 0 rgba(0,255,116,0.8); }
    100% { box-shadow: 0 0 22px 6px rgba(0,255,116,0); }
  }
  @keyframes shakeX {
    10%, 90% { transform: translateX(-2px) rotateY(180deg); }
    20%, 80% { transform: translateX(3px) rotateY(180deg); }
    30%, 50%, 70% { transform: translateX(-6px) rotateY(180deg); }
    40%, 60% { transform: translateX(6px) rotateY(180deg); }
  }
  @keyframes winPop {
    0% { opacity: 0; transform: scale(0.6); }
    60% { opacity: 1; transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(420px) rotate(540deg); opacity: 0; }
  }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background:
      radial-gradient(circle at 15% 15%, rgba(0,255,116,0.18), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(255,51,167,0.22), transparent 45%),
      linear-gradient(120deg, #000000, #0d0518, #000000);
    background-size: 200% 200%;
    animation: bgPulse 14s ease infinite;
    color: var(--ink); font-family: 'Roboto Mono', monospace;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .wrap { position: relative; max-width: 420px; width: 100%; margin: 20px; text-align: center; }
  h1 { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 22px; color: var(--gold); margin: 0 0 6px; letter-spacing: 1px; animation: titleGlow 3s ease-in-out infinite; }
  .status { font-size: 17px; color: var(--ink-dim); margin-bottom: 16px; transition: color 0.15s, transform 0.15s; }
  .status.bump { color: var(--accent-light); transform: scale(1.08); }
  .board {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .card { aspect-ratio: 1; perspective: 700px; cursor: pointer; user-select: none; }
  .card.matched { cursor: default; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.45s cubic-bezier(.3,1.4,.4,1);
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .card.shake .card-inner { animation: shakeX 0.4s ease; }
  .card-back, .card-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    border: 3px solid var(--ink); box-shadow: 3px 3px 0 #000; font-size: 26px;
  }
  .card-back { background: var(--panel-light); color: var(--accent-light); transition: box-shadow 0.15s, border-color 0.15s; }
  .card:not(.flipped):not(.matched):hover .card-back { border-color: var(--accent-light); box-shadow: 4px 4px 0 #000, 0 0 10px 1px rgba(169,81,237,0.6); }
  .card-face { background: var(--panel); transform: rotateY(180deg); }
  .card.matched .card-face { border-color: var(--teal); animation: matchPulse 0.6s ease; }
  .win-msg {
    margin-top: 18px; font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 16px; color: var(--teal);
    min-height: 20px; text-shadow: 0 0 12px rgba(0,255,116,0.7);
  }
  .win-msg:not(:empty) { animation: winPop 0.4s cubic-bezier(.2,1.4,.4,1); }
  .restart-btn {
    margin-top: 14px; padding: 10px 20px; background: var(--accent); color: #fff; border: 3px solid var(--ink);
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 13px; cursor: pointer;
    box-shadow: 3px 3px 0 #000, 0 0 12px 1px rgba(106,0,224,0.7); display: none;
  }
  .restart-btn:hover { background: var(--accent-light); }
  .restart-btn:active { transform: translate(3px,3px); box-shadow: 0 0 0 #000; }
  .confetti-piece { position: absolute; top: 0; width: 8px; height: 8px; pointer-events: none; animation: confettiFall 1.5s ease-in forwards; z-index: 5; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>MERK-PAARE</h1>
  <p class="status" id="status">Züge: 0</p>
  <div class="board" id="board"></div>
  <p class="win-msg" id="win-msg"></p>
  <button class="restart-btn" id="restart-btn">NOCHMAL SPIELEN</button>
</div>
<script>
(function(){
  const icons = ['🌍','💧','☀️','🌱','♻️','🔋','🚲','🌬️'];
  let deck = [], flipped = [], matchedCount = 0, moves = 0, lock = false;
  const wrap = document.getElementById('wrap');

  let actx = null;
  function beep(freq, dur, type) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(); osc.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  function sfxFlip() { beep(420, 0.08, 'square'); }
  function sfxMatch() { beep(660, 0.12, 'square'); setTimeout(() => beep(880, 0.16, 'square'), 90); }
  function sfxMiss() { beep(160, 0.22, 'sawtooth'); }
  function sfxWin() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square'), i * 100)); }

  const confettiColors = ['#ff33a7', '#a951ed', '#00ff74', '#6a00e0', '#f9f9f9'];
  function burstConfetti(count) {
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.background = confettiColors[i % confettiColors.length];
      piece.style.animationDelay = (Math.random() * 0.25) + 's';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      wrap.appendChild(piece);
      setTimeout(() => piece.remove(), 1800);
    }
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const board = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const winMsg = document.getElementById('win-msg');
  const restartBtn = document.getElementById('restart-btn');

  function init() {
    deck = shuffle([...icons, ...icons]);
    flipped = []; matchedCount = 0; moves = 0; lock = false;
    winMsg.textContent = ''; restartBtn.style.display = 'none';
    statusEl.textContent = 'Züge: 0';
    board.innerHTML = '';
    deck.forEach((icon, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.icon = icon;
      card.dataset.index = i;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-back">?</div>
          <div class="card-face">${icon}</div>
        </div>`;
      card.addEventListener('click', () => flip(card));
      board.appendChild(card);
    });
  }

  function bumpStatus() {
    statusEl.classList.add('bump');
    setTimeout(() => statusEl.classList.remove('bump'), 200);
  }

  function flip(card) {
    if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    card.classList.add('flipped');
    sfxFlip();
    flipped.push(card);
    if (flipped.length === 2) {
      moves++;
      statusEl.textContent = `Züge: ${moves}`;
      bumpStatus();
      lock = true;
      const [a, b] = flipped;
      if (a.dataset.icon === b.dataset.icon) {
        setTimeout(() => {
          a.classList.add('matched'); b.classList.add('matched');
          sfxMatch();
          matchedCount++;
          flipped = []; lock = false;
          if (matchedCount === icons.length) {
            winMsg.textContent = `GESCHAFFT IN ${moves} ZÜGEN!`;
            restartBtn.style.display = 'inline-block';
            sfxWin();
            burstConfetti(28);
          }
        }, 250);
      } else {
        setTimeout(() => { a.classList.add('shake'); b.classList.add('shake'); sfxMiss(); }, 250);
        setTimeout(() => {
          a.classList.remove('flipped', 'shake'); b.classList.remove('flipped', 'shake');
          flipped = []; lock = false;
        }, 900);
      }
    }
  }

  restartBtn.addEventListener('click', init);
  init();
})();
</script>
<button id="fs-toggle-btn" type="button" aria-label="Vollbild umschalten">⛶ MAXIMIEREN</button>
<style>
  #fs-toggle-btn {
    position: fixed; top: 10px; right: 10px; z-index: 9999;
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 11px; line-height: 1;
    padding: 9px 11px; background: #171a1a; color: #a951ed;
    border: 2px solid #a951ed; box-shadow: 3px 3px 0 #000; cursor: pointer;
    white-space: nowrap;
  }
  #fs-toggle-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #000; }
  #fs-toggle-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<script>
(function(){
  var btn = document.getElementById('fs-toggle-btn');
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function updateBtn(){ btn.textContent = isFs() ? '× VERLASSEN' : '⛶ MAXIMIEREN'; }
  btn.addEventListener('click', function(){
    if (!isFs()) {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  });
  document.addEventListener('fullscreenchange', updateBtn);
  document.addEventListener('webkitfullscreenchange', updateBtn);
  updateBtn();
})();
</script>
</body>
</html>
