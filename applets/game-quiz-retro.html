<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klima-Quiz — Retro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000; --panel: #171a1a; --panel-light: #23282a;
    --ink: #f9f9f9; --ink-dim: #a9a9a9;
    --accent: #6a00e0; --accent-dark: #4c009e; --accent-light: #a951ed;
    --gold: #ff33a7; --teal: #00ff74;
  }
  * { box-sizing: border-box; }
  @keyframes bgPulse {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes borderGlow {
    0%, 100% { box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px var(--accent-light), 0 0 24px 4px rgba(169,81,237,0.55), 8px 8px 0 8px rgba(0,0,0,0.5); }
    50% { box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px var(--gold), 0 0 32px 8px rgba(255,51,167,0.6), 8px 8px 0 8px rgba(0,0,0,0.5); }
  }
  @keyframes titleFlicker {
    0%, 92%, 100% { opacity: 1; text-shadow: 0 0 6px var(--gold), 0 0 18px rgba(255,51,167,0.7); }
    93% { opacity: 0.6; text-shadow: none; }
    95% { opacity: 1; text-shadow: 0 0 6px var(--gold), 0 0 18px rgba(255,51,167,0.7); }
  }
  @keyframes shimmer {
    0% { background-position: -120px 0; }
    100% { background-position: 120px 0; }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: translateY(10px) scale(0.97); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes shakeX {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }
  @keyframes correctGlow {
    0% { box-shadow: 0 0 0 0 rgba(0,255,116,0.7); }
    100% { box-shadow: 0 0 26px 8px rgba(0,255,116,0); }
  }
  @keyframes scoreCountBounce {
    0% { transform: scale(0.4); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(340px) rotate(540deg); opacity: 0; }
  }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(106,0,224,0.35), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(255,51,167,0.25), transparent 45%),
      linear-gradient(120deg, #000000, #0d0518, #000000);
    background-size: 200% 200%;
    animation: bgPulse 12s ease infinite;
    color: var(--ink);
    font-family: 'Roboto Mono', monospace;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card {
    position: relative;
    max-width: 460px; width: 100%; margin: 20px;
    background: var(--panel);
    border: 4px solid var(--ink);
    animation: borderGlow 3.2s ease-in-out infinite;
    padding: 26px 24px;
    overflow: hidden;
  }
  h1 {
    font-size: 22px; color: var(--gold); text-align: center; margin: 0 0 6px;
    font-family: 'Roboto Mono', monospace; font-weight: 700; letter-spacing: 1px;
    animation: titleFlicker 5s linear infinite;
  }
  .progress { font-size: 15px; color: var(--ink-dim); text-align: center; margin-bottom: 18px; }
  .bar-track { background: var(--panel-light); height: 10px; border: 2px solid var(--ink); margin-bottom: 22px; overflow: hidden; }
  .bar-fill {
    height: 100%; width: 0%; transition: width 0.4s ease;
    background: linear-gradient(90deg, var(--accent-light), var(--gold), var(--teal), var(--accent-light));
    background-size: 240px 100%;
    animation: shimmer 1.6s linear infinite;
    box-shadow: 0 0 10px 1px rgba(169,81,237,0.8);
  }
  .question { font-size: 19px; margin-bottom: 18px; line-height: 1.4; animation: popIn 0.35s ease; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    border: 3px solid var(--ink); background: var(--panel-light); color: var(--ink);
    padding: 12px 14px; font-size: 16px; text-align: left; cursor: pointer;
    box-shadow: 3px 3px 0 #000;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    animation: popIn 0.35s ease backwards;
  }
  .opt:nth-child(1) { animation-delay: 0.02s; }
  .opt:nth-child(2) { animation-delay: 0.08s; }
  .opt:nth-child(3) { animation-delay: 0.14s; }
  .opt:hover:not(:disabled) {
    background: #3a2f70; border-color: var(--accent-light);
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 #000, 0 0 12px 1px rgba(169,81,237,0.6);
  }
  .opt:active:not(:disabled) { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
  .opt.correct { background: var(--teal); color: #0f0a1e; border-color: var(--teal); animation: correctGlow 0.7s ease; }
  .opt.wrong { background: var(--gold); border-color: var(--gold); }
  .opt:disabled { cursor: default; }
  .card.shake { animation: borderGlow 3.2s ease-in-out infinite, shakeX 0.4s ease; }
  .feedback { margin-top: 14px; font-size: 15px; color: var(--ink-dim); min-height: 20px; }
  .next-btn {
    margin-top: 16px; width: 100%; padding: 12px;
    background: var(--accent); color: #fff; border: 3px solid var(--ink);
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 13px; cursor: pointer;
    box-shadow: 4px 4px 0 #000, 0 0 14px 1px rgba(106,0,224,0.7); display: none;
    transition: transform 0.1s ease;
  }
  .next-btn:hover { background: var(--accent-light); }
  .next-btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 #000; }
  .result { text-align: center; }
  .result .score {
    font-size: 48px; color: var(--gold); font-family: 'Roboto Mono', monospace; font-weight: 700; margin: 14px 0;
    text-shadow: 0 0 14px rgba(255,51,167,0.8);
    animation: scoreCountBounce 0.5s cubic-bezier(.2,1.4,.4,1);
  }
  .result p { color: var(--ink-dim); font-size: 16px; }
  .confetti-piece {
    position: absolute; top: 0; width: 8px; height: 8px; pointer-events: none;
    animation: confettiFall 1.4s ease-in forwards;
    z-index: 5;
  }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
(function(){
  const questions = [
    { q: 'Welche Maßnahme spart am meisten CO2 im Alltag?', opts: ['Fahrrad statt Auto', 'Licht öfter ausschalten', 'Kürzer duschen'], correct: 0 },
    { q: 'Was passiert bei steigender Meerestemperatur mit Korallen?', opts: ['Sie wachsen schneller', 'Sie bleichen aus', 'Nichts verändert sich'], correct: 1 },
    { q: 'Welche Energiequelle ist erneuerbar?', opts: ['Kohle', 'Erdgas', 'Windkraft'], correct: 2 },
    { q: 'Was bedeutet "CO2-Fußabdruck"?', opts: ['Menge an CO2, die durch das eigene Verhalten verursacht wird', 'Ein Schuh aus recyceltem Material', 'Die Größe eines Waldes'], correct: 0 }
  ];
  let idx = 0, score = 0;
  const card = document.getElementById('card');

  let actx = null;
  function beep(freq, dur, type) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.16, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(); osc.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  function sfxCorrect() { beep(660, 0.12, 'square'); setTimeout(() => beep(880, 0.16, 'square'), 90); }
  function sfxWrong() { beep(160, 0.28, 'sawtooth'); }
  function sfxWin() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square'), i * 100)); }

  const confettiColors = ['#ff33a7', '#a951ed', '#00ff74', '#6a00e0', '#f9f9f9'];
  function burstConfetti(count) {
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.background = confettiColors[i % confettiColors.length];
      piece.style.animationDelay = (Math.random() * 0.2) + 's';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      card.appendChild(piece);
      setTimeout(() => piece.remove(), 1700);
    }
  }

  function render() {
    if (idx >= questions.length) return renderResult();
    const q = questions[idx];
    card.classList.remove('shake');
    card.innerHTML = `
      <h1>KLIMA-QUIZ</h1>
      <p class="progress">Frage ${idx + 1} von ${questions.length}</p>
      <div class="bar-track"><div class="bar-fill" style="width:${(idx/questions.length)*100}%"></div></div>
      <p class="question">${q.q}</p>
      <div class="options" id="opts"></div>
      <p class="feedback" id="feedback"></p>
      <button class="next-btn" id="next-btn">WEITER →</button>
    `;
    const optsEl = document.getElementById('opts');
    q.opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = opt;
      btn.addEventListener('click', () => answer(i, btn));
      optsEl.appendChild(btn);
    });
  }

  function answer(i, btn) {
    const q = questions[idx];
    const allBtns = document.querySelectorAll('.opt');
    allBtns.forEach(b => b.disabled = true);
    if (i === q.correct) {
      btn.classList.add('correct');
      document.getElementById('feedback').textContent = 'Richtig!';
      score++;
      sfxCorrect();
      burstConfetti(14);
    } else {
      btn.classList.add('wrong');
      allBtns[q.correct].classList.add('correct');
      document.getElementById('feedback').textContent = 'Nicht ganz — richtig war markiert.';
      sfxWrong();
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 420);
    }
    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('next-btn').onclick = () => { idx++; render(); };
  }

  function renderResult() {
    const perfect = score === questions.length;
    card.innerHTML = `
      <div class="result">
        <h1>ERGEBNIS</h1>
        <p class="score">${score}/${questions.length}</p>
        <p>${perfect ? 'Perfekt gemeistert!' : 'Gut gemacht — nochmal versuchen?'}</p>
        <button class="next-btn" style="display:block" id="restart-btn">NOCHMAL SPIELEN</button>
      </div>
    `;
    if (perfect) { sfxWin(); burstConfetti(30); } else { beep(340, 0.2, 'triangle'); }
    document.getElementById('restart-btn').onclick = () => { idx = 0; score = 0; render(); };
  }

  render();
})();
</script>
<button id="fs-toggle-btn" type="button" aria-label="Vollbild umschalten">⛶ MAXIMIEREN</button>
<style>
  #fs-toggle-btn {
    position: fixed; top: 10px; right: 10px; z-index: 9999;
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 11px; line-height: 1;
    padding: 9px 11px; background: #171a1a; color: #a951ed;
    border: 2px solid #a951ed; box-shadow: 3px 3px 0 #000; cursor: pointer;
    white-space: nowrap;
  }
  #fs-toggle-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #000; }
  #fs-toggle-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<script>
(function(){
  var btn = document.getElementById('fs-toggle-btn');
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function updateBtn(){ btn.textContent = isFs() ? '× VERLASSEN' : '⛶ MAXIMIEREN'; }
  btn.addEventListener('click', function(){
    if (!isFs()) {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  });
  document.addEventListener('fullscreenchange', updateBtn);
  document.addEventListener('webkitfullscreenchange', updateBtn);
  updateBtn();
})();
</script>
</body>
</html>
