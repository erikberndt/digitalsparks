<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klima-Quiz — Retro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0a1e; --panel: #1a1440; --panel-light: #2c2260;
    --ink: #f2eee0; --ink-dim: #a79fd6;
    --accent: #ff4d6d; --accent-dark: #c0233f;
    --gold: #ffd23f; --teal: #2ec4a6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font-family: 'VT323', monospace;
    display: flex; align-items: center; justify-content: center;
  }
  .pixel-font { font-family: 'Press Start 2P', monospace; }
  .card {
    max-width: 460px; width: 100%; margin: 20px;
    background: var(--panel);
    border: 4px solid var(--ink);
    box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px var(--ink), 8px 8px 0 8px rgba(0,0,0,0.5);
    padding: 26px 24px;
  }
  h1 { font-size: 14px; color: var(--gold); text-align: center; margin: 0 0 6px; font-family: 'Press Start 2P', monospace; }
  .progress { font-size: 15px; color: var(--ink-dim); text-align: center; margin-bottom: 18px; }
  .bar-track { background: var(--panel-light); height: 10px; border: 2px solid var(--ink); margin-bottom: 22px; }
  .bar-fill { background: var(--teal); height: 100%; width: 0%; transition: width 0.3s; }
  .question { font-size: 19px; margin-bottom: 18px; line-height: 1.4; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    border: 3px solid var(--ink); background: var(--panel-light); color: var(--ink);
    padding: 12px 14px; font-size: 16px; text-align: left; cursor: pointer;
    box-shadow: 3px 3px 0 #000;
  }
  .opt:hover { background: #3a2f70; }
  .opt.correct { background: var(--teal); color: #0f0a1e; border-color: var(--teal); }
  .opt.wrong { background: var(--accent); border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .feedback { margin-top: 14px; font-size: 15px; color: var(--ink-dim); min-height: 20px; }
  .next-btn {
    margin-top: 16px; width: 100%; padding: 12px;
    background: var(--accent); color: #fff; border: 3px solid var(--ink);
    font-family: 'Press Start 2P', monospace; font-size: 11px; cursor: pointer;
    box-shadow: 4px 4px 0 #000; display: none;
  }
  .next-btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 #000; }
  .result { text-align: center; }
  .result .score { font-size: 34px; color: var(--gold); font-family: 'Press Start 2P', monospace; margin: 14px 0; }
  .result p { color: var(--ink-dim); font-size: 16px; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
(function(){
  const questions = [
    { q: 'Welche Maßnahme spart am meisten CO2 im Alltag?', opts: ['Fahrrad statt Auto', 'Licht öfter ausschalten', 'Kürzer duschen'], correct: 0 },
    { q: 'Was passiert bei steigender Meerestemperatur mit Korallen?', opts: ['Sie wachsen schneller', 'Sie bleichen aus', 'Nichts verändert sich'], correct: 1 },
    { q: 'Welche Energiequelle ist erneuerbar?', opts: ['Kohle', 'Erdgas', 'Windkraft'], correct: 2 },
    { q: 'Was bedeutet "CO2-Fußabdruck"?', opts: ['Menge an CO2, die durch das eigene Verhalten verursacht wird', 'Ein Schuh aus recyceltem Material', 'Die Größe eines Waldes'], correct: 0 }
  ];
  let idx = 0, score = 0;
  const card = document.getElementById('card');

  function render() {
    if (idx >= questions.length) return renderResult();
    const q = questions[idx];
    card.innerHTML = `
      <h1>KLIMA-QUIZ</h1>
      <p class="progress">Frage ${idx + 1} von ${questions.length}</p>
      <div class="bar-track"><div class="bar-fill" style="width:${(idx/questions.length)*100}%"></div></div>
      <p class="question">${q.q}</p>
      <div class="options" id="opts"></div>
      <p class="feedback" id="feedback"></p>
      <button class="next-btn" id="next-btn">WEITER →</button>
    `;
    const optsEl = document.getElementById('opts');
    q.opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = opt;
      btn.addEventListener('click', () => answer(i, btn));
      optsEl.appendChild(btn);
    });
  }

  function answer(i, btn) {
    const q = questions[idx];
    const allBtns = document.querySelectorAll('.opt');
    allBtns.forEach(b => b.disabled = true);
    if (i === q.correct) {
      btn.classList.add('correct');
      document.getElementById('feedback').textContent = 'Richtig!';
      score++;
    } else {
      btn.classList.add('wrong');
      allBtns[q.correct].classList.add('correct');
      document.getElementById('feedback').textContent = 'Nicht ganz — richtig war markiert.';
    }
    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('next-btn').onclick = () => { idx++; render(); };
  }

  function renderResult() {
    card.innerHTML = `
      <div class="result">
        <h1>ERGEBNIS</h1>
        <p class="score">${score}/${questions.length}</p>
        <p>${score === questions.length ? 'Perfekt gemeistert!' : 'Gut gemacht — nochmal versuchen?'}</p>
        <button class="next-btn" style="display:block" id="restart-btn">NOCHMAL SPIELEN</button>
      </div>
    `;
    document.getElementById('restart-btn').onclick = () => { idx = 0; score = 0; render(); };
  }

  render();
})();
</script>
</body>
</html>
