<!doctype html>
<html lang="de">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Digital Spark Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: Vollbild-3D-Bühne (Canvas), darüber HUD oben (Stufen + Signal), Auswahl-Panel unten, Kino-Overlay in der Ego-Perspektive.
   Bewusst einheitlich dunkel wie ein Spiel-Auswahlbildschirm – kein Hell-Modus. */
:root {
  --night: #0f0d13;
  --panel: rgba(22, 19, 28, .86);
  --panel-solid: #1a1720;
  --line: rgba(255, 255, 255, .14);
  --ink: #f4eee9;
  --muted: #b2a8b3;
  --spark: #f2662f;
  --spark-2: #ffb938;
  --link: #2fd3b4;
  --f-display: "Sora", "Avenir Next", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sat: .25;
  color-scheme: dark;
}
:root[data-step="2"] { --sat: .75; }
:root[data-step="3"] { --sat: 1.1; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--spark-2); outline-offset: 3px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; filter: saturate(var(--sat)); transition: filter 1s; touch-action: manipulation; }
#gl.hover { cursor: pointer; }

/* HUD oben */
.hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: grid; gap: 10px; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  transition: opacity .5s, transform .5s; }
.hud > * { pointer-events: auto; }
.hud.off { opacity: 0; transform: translateY(-20px); }
.hud.off > * { pointer-events: none; }
.hud-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; max-width: 1100px; width: 100%; margin: 0 auto; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; margin: 0; }
.brand span { color: var(--spark); }
.stepper { display: flex; gap: 6px; flex: 1; min-width: 0; flex-wrap: wrap; }
.stepper button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 6px 12px; font-size: 13px; display: inline-flex; gap: 6px; align-items: baseline; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.stepper button .u { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stepper button[aria-current="step"] { border-color: var(--spark-2); background: rgba(255, 185, 56, .14); }
.stepper button.past .u::after { content: " ✓"; color: var(--link); }
.signal { display: flex; align-items: center; gap: 10px; min-width: 220px; }
.signal .lbl { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.track { flex: 1; height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; position: relative; min-width: 90px; }
.fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--spark), var(--spark-2)); border-radius: inherit; transition: width 1s cubic-bezier(.2,.8,.2,1); }
.track .mark { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--night); }
.pct { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
.pts { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.pts b { color: var(--ink); font-family: var(--f-display); }

/* Namensschilder über den Figuren */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; transition: opacity .4s; }
#labels.off { opacity: 0; }
.tagl { position: absolute; transform: translate(-50%, -100%); display: grid; justify-items: center; gap: 3px; white-space: nowrap; }
.tagl .n { font-family: var(--f-display); font-weight: 700; font-size: 15px; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
.tagl .s { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.tagl .s.new { background: var(--spark-2); color: #2a1a00; border-color: transparent; }
.tagl .s.ok { color: var(--link); }
.tagl.locked .n { color: var(--muted); font-size: 13px; }

/* Auswahl-Panel unten */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; justify-items: center; gap: 10px;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.dock > * { pointer-events: auto; }
.hint { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }
.sel { width: min(620px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 18px 20px; display: grid; gap: 10px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); animation: up .45s cubic-bezier(.2,.9,.3,1.1) both; }
@keyframes up { from { opacity: 0; transform: translateY(24px); } }
.sel .eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--spark-2); }
.sel h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 30px; letter-spacing: -.02em; line-height: 1.05; }
.sel q { font-size: 16px; color: var(--ink); quotes: "„" "“"; }
.mood { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.mood b { color: var(--ink); font-weight: 600; }
.rx { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.rx i { width: 4px; border-radius: 1px; background: rgba(255,255,255,.18); }
.rx i.on { background: var(--c, var(--spark-2)); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.primary { border: 0; background: var(--ink); color: #17131c; font-family: var(--f-display); font-weight: 700; font-size: 16px; border-radius: 99px; padding: 13px 22px; display: inline-flex; align-items: center; gap: 10px; transition: transform .15s, background .2s; }
.primary:hover { transform: translateY(-2px); background: #fff; }
.primary .k { width: 22px; height: 22px; border-radius: 50%; background: var(--c, var(--spark)); display: inline-grid; place-items: center; }
.primary .k svg { width: 10px; height: 10px; fill: #fff; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 12px 18px; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: rgba(255,255,255,.3); }
.next { border: 0; background: linear-gradient(90deg, var(--spark), var(--spark-2)); color: #23140a; font-family: var(--f-display); font-weight: 800; font-size: 16px; border-radius: 99px; padding: 14px 26px; animation: up .5s both; box-shadow: 0 10px 40px -10px rgba(242, 102, 47, .7); }

/* Kino-Modus */
.bar { position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 7; transition: height .7s cubic-bezier(.6,0,.2,1); }
.bar.t { top: 0; } .bar.b { bottom: 0; }
body.cine .bar { height: 9vh; }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 9; transition: opacity .45s; }
#fade.on { opacity: 1; }
.fp { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
.fp > * { pointer-events: auto; }
.fp-tag { position: absolute; top: calc(9vh + 14px); left: max(16px, env(safe-area-inset-left, 0px)); font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; color: var(--muted); }
.fp-tag .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3d3d; animation: breathe 1.2s infinite; }
.fp-ctrl { position: absolute; top: calc(9vh + 8px); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.fp-ctrl button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 7px 14px; font-size: 13px; }
.sub { position: absolute; left: 50%; bottom: calc(9vh + 22px); transform: translateX(-50%); width: min(760px, calc(100% - 32px)); text-align: center; pointer-events: none; }
.sub .who { font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--c, var(--spark-2)); }
.sub .line { font-family: var(--f-display); font-weight: 600; font-size: clamp(18px, 2.6vw, 26px); line-height: 1.3; text-wrap: balance; text-shadow: 0 2px 18px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.8); animation: subIn .4s both; }
@keyframes subIn { from { opacity: 0; transform: translateY(8px); } }
.wave { display: inline-flex; gap: 2px; align-items: center; height: 14px; margin-left: 6px; vertical-align: middle; }
.wave i { width: 3px; height: 100%; background: var(--c, var(--spark-2)); border-radius: 2px; animation: eq .7s ease-in-out infinite alternate; }
.wave i:nth-child(2) { animation-delay: -.2s; } .wave i:nth-child(3) { animation-delay: -.45s; } .wave i:nth-child(4) { animation-delay: -.1s; }
.wave.off i { animation: none; transform: scaleY(.25); }
@keyframes eq { to { transform: scaleY(.25); } }
.decide { position: absolute; left: 50%; bottom: calc(9vh + 18px); transform: translateX(-50%); width: min(640px, calc(100% - 32px)); display: grid; gap: 10px; animation: up .45s both; }
.decide .ask { font-family: var(--f-display); font-weight: 700; font-size: 18px; text-align: center; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
.decide .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .decide .row { grid-template-columns: 1fr; } }
.choice { border: 1px solid var(--line); background: var(--panel); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-radius: 18px; padding: 14px 16px; text-align: left; display: grid; gap: 2px; font-weight: 600; font-size: 16px; transition: transform .15s, border-color .2s; }
.choice small { font-weight: 400; color: var(--muted); font-size: 13px; }
.choice:hover { transform: translateY(-3px); border-color: var(--c, var(--spark-2)); }
.choice .key { font-family: var(--f-mono); font-size: 11px; color: var(--c, var(--spark-2)); letter-spacing: .08em; }
.result { position: absolute; left: 50%; bottom: calc(9vh + 18px); transform: translateX(-50%); width: min(560px, calc(100% - 32px)); background: var(--panel); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px; display: grid; gap: 10px; animation: up .45s both; }
.result p { margin: 0; font-size: 15.5px; }
.plus { font-family: var(--f-display); font-weight: 800; color: var(--link); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.plus .b { display: inline-block; animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; font-size: 20px; }
@keyframes pop { from { transform: scale(0); } }

/* Feier */
.cele { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.cele .inner { display: grid; gap: 12px; justify-items: center; max-width: 520px; pointer-events: auto; animation: up .6s both; }
.cele .big { font-family: var(--f-display); font-weight: 800; font-size: clamp(80px, 17vw, 160px); line-height: .9; letter-spacing: -.05em; font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #fff, var(--spark-2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 8px 30px rgba(242,102,47,.6)); }
.cele h2 { margin: 0; font-family: var(--f-display); font-size: clamp(22px, 4vw, 32px); text-shadow: 0 2px 16px rgba(0,0,0,.8); }
.cele p { margin: 0; color: var(--ink); max-width: 42ch; text-shadow: 0 2px 12px rgba(0,0,0,.9); }

.loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; z-index: 1; }
@media (max-width: 640px) {
  .signal { min-width: 0; flex: 1 1 100%; }
  .sel h2 { font-size: 24px; }
  .stepper button .t { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<div class="loading" id="loading">Bühne wird aufgebaut …</div>
<canvas id="gl"></canvas>
<div id="labels"></div>

<header class="hud" id="hud">
  <div class="hud-row">
    <h1 class="brand">Digital <span>Spark</span></h1>
    <nav class="stepper" id="stepper" aria-label="Workshop-Stufe"></nav>
    <span class="pts" id="pts"></span>
  </div>
  <div class="hud-row">
    <div class="signal">
      <span class="lbl">Signal</span>
      <div class="track" role="progressbar" aria-label="Signalstärke der Gruppe" aria-valuemin="0" aria-valuemax="100" id="track"><div class="fill" id="fill"></div><span class="mark"></span></div>
      <span class="pct" id="pct">0%</span>
    </div>
  </div>
</header>

<div class="dock" id="dock"></div>
<div class="bar t"></div><div class="bar b"></div>
<div class="fp" id="fp" hidden></div>
<div class="cele" id="cele" hidden></div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   MOCK-DATEN
   – stages: Unit-Label, Titel, Signalbereich je Stufe
   – characters: Aussehen (look), Freischaltung (unlock), Platz auf der Bühne (slot),
     pro Stufe steps[n] mit Vorschau, Stimmung [vorher, nachher], Monolog,
     Szene (env, Kamera, Statist:innen, beats je Monologzeile) und 2 Choices (mit outcome-beats).
   Beat-Aktionen: look, camWalk, walk, turn, wave, nod, laugh, camNod, phone, screen, wait.
   ===================================================================== */
const L = (x, y, z, d) => ({ a: "look", at: [x, y, z], d });
const W = (ms) => ({ a: "wait", ms });

const DATA = {
  moodScale: { 1: "abgeschnitten", 2: "ein Spalt offen", 3: "vorsichtig dabei", 4: "verbunden", 5: "voller Empfang" },
  stages: {
    1: { unit: "Unit 1–2", title: "Status quo", signal: [8, 35], next: "Weiter zu Unit 3–4" },
    2: { unit: "Unit 3–4", title: "Erste Brücken", signal: [50, 75], next: "Weiter zu Unit 5" },
    3: { unit: "Unit 5", title: "Volle Verbindung", signal: [80, 100], next: null }
  },
  characters: [
    {
      id: "alex", name: "Alex", role: "Rückzug", unlock: 1, slot: [-3.3, -0.3], pitch: 0.85,
      look: { color: "#5574f0", skin: "#e0b08a", hair: "#3a2a20", pants: "#2b2f3d", style: "hood" },
      steps: {
        1: {
          preview: "Alle lachen über irgendwas im Chat. Ich hab's nicht mitbekommen.", mood: [1, 2],
          monologue: ["In der Pause stehen alle in ihren Grüppchen.", "Ich tu so, als würde ich was Wichtiges am Handy checken. Eigentlich scroll ich nur.", "Wenn mich jemand anspricht, weiß ich nicht mal, was ich sagen soll. Also sag ich lieber nichts."],
          scene: {
            env: "yard", eye: 1.6, cam: [0, 3], look: [-2, 1.5, -2],
            npcs: [
              { id: "a1", at: [-3.6, -2.6], face: [-3, -3] }, { id: "a2", at: [-2.4, -2.6], face: [-3, -3] }, { id: "a3", at: [-3, -3.6], face: [-3, -3] },
              { id: "b1", at: [2.4, -1.7], face: [3, -2.2] }, { id: "b2", at: [3.5, -2.4], face: [3, -2.2] }
            ],
            beats: [
              [L(-3, 1.5, -3, 1400), { a: "laugh", ids: ["a1", "a2", "a3"] }, W(400), L(3, 1.5, -2, 1800), { a: "laugh", ids: ["b1", "b2"] }],
              [{ a: "phone", on: true, screen: { type: "feed", title: "Feed" } }, L(0.4, 0.6, -2, 1400)],
              [{ a: "turn", id: "b1", to: "cam" }, L(2.4, 1.6, -1.7, 1000), W(1200), { a: "turn", id: "b1", to: [3, -2.2] }, L(0.4, 0.6, -2, 1200)]
            ]
          },
          choices: [
            { label: "Kurz zurücknicken", hint: "wenn jemand rüberschaut", outcome: "Jemand nickt zurück. Kein Gespräch, aber ein kleiner Kontakt. Fühlt sich weniger unsichtbar an.",
              beats: [{ a: "phone", on: false }, L(2.4, 1.6, -1.7, 1000), { a: "turn", id: "b1", to: "cam" }, W(500), { a: "camNod" }, W(300), { a: "nod", id: "b1" }] },
            { label: "Mit Emoji reagieren", hint: "auf die letzte Nachricht im Chat", outcome: "Ein Daumen hoch im Gruppenchat. Zwei Leute reagieren darauf. Alex ist wieder ein bisschen sichtbar.",
              beats: [{ a: "screen", target: "phone", spec: { type: "chat", title: "Klasse 9b", msgs: [{ name: "Ben", text: "wer hat das video gemacht 😂" }, { name: "Lea", text: "legendär" }] } }, W(900),
                { a: "screen", target: "phone", spec: { type: "chat", title: "Klasse 9b", msgs: [{ name: "Ben", text: "wer hat das video gemacht 😂" }, { name: "Lea", text: "legendär" }, { me: true, text: "👍" }] } }, W(1200),
                { a: "screen", target: "phone", spec: { type: "chat", title: "Klasse 9b", msgs: [{ name: "Ben", text: "wer hat das video gemacht 😂" }, { name: "Lea", text: "legendär" }, { me: true, text: "👍", react: "❤️ 2" }] } }] }
          ]
        },
        2: {
          preview: "Sam hat heute was mit einem Stift erzählt. Hm.", mood: [2, 3],
          monologue: ["Sam hat erzählt, dass er sich einfach einen Stift geliehen hat, um ins Gespräch zu kommen.", "Klingt fast zu simpel.", "Aber vielleicht muss es ja nicht gleich ein ganzes Gespräch sein."],
          scene: {
            env: "class", eye: 1.2, cam: [0, 2.6], look: [0, 1.1, -4],
            npcs: [
              { id: "sam", char: "sam", at: [0, -1.6], face: [0, -10], sit: true },
              { id: "n1", at: [2.5, 2.6], face: [2.5, -10], sit: true },
              { id: "c1", at: [-2.5, 0.4], face: [-2.5, -10], sit: true }, { id: "c2", at: [2.5, 0.4], face: [2.5, -10], sit: true },
              { id: "c3", at: [-2.5, -1.6], face: [-2.5, -10], sit: true }
            ],
            beats: [
              [L(0, 1.05, -1.6, 1400), { a: "turn", id: "sam", to: "cam" }, W(300), { a: "wave", id: "sam" }],
              [{ a: "turn", id: "sam", to: [0, -10] }, L(0, 0.3, 1.2, 1400)],
              [L(2.5, 1.0, 2.6, 1600)]
            ]
          },
          choices: [
            { label: "Sams Trick testen", hint: "in der nächsten Stunde", outcome: "Alex fragt nach einem Lineal. Kurzer Satz, kurzes Lächeln. Das war's. Und es war okay.",
              beats: [{ a: "turn", id: "n1", to: "cam" }, W(600), { a: "nod", id: "n1" }, W(300), { a: "camNod" }] },
            { label: "Sam fragen, wie's lief", hint: "per Nachricht", outcome: "Sam antwortet sofort und schickt ein Lach-Emoji mit. Der Tipp ist bei Alex angekommen.",

                { a: "screen", target: "phone", spec: { type: "chat", title: "Sam", msgs: [{ me: true, text: "wie lief das mit dem stift?" }, { name: "Sam", text: "easy 😄 frag einfach was kleines" }] } }] }
          ]
        },
        3: {
          preview: "Wir sind heute zu dritt zur Bahn gelaufen.", mood: [3, 4],
          monologue: ["Heute bin ich mit Sam und Mia zur Bahn gelaufen.", "Wir haben über nichts Besonderes geredet.", "Genau das war gut."],
          scene: {
            env: "yard", eye: 1.6, cam: [0, 7], look: [0, 1.5, -8],
            npcs: [
              { id: "mia", char: "mia", at: [-1.1, 5.8], face: [-1.1, -10] }, { id: "sam", char: "sam", at: [1.2, 5.9], face: [1.2, -10] },
              { id: "jo", char: "jo", at: [-9, -2], face: [0, 0] }
            ],
            beats: [
              [{ a: "camWalk", to: [0, 3.5], d: 4200, with: ["mia", "sam"] }],
              [L(-1.1, 1.5, 2.3, 1100), { a: "turn", id: "mia", to: "cam" }, W(300), { a: "laugh", ids: ["mia", "sam"] }],
              [{ a: "turn", id: "mia", to: [-1.1, -10] }, L(0, 1.7, -8, 1300), { a: "camWalk", to: [0, 1.5], d: 2600, with: ["mia", "sam"] }]
            ]

    case "laugh": a.ids.forEach(id => { if (worldFigs[id]) worldFigs[id].laughUntil = performance.now() + 1800; }); return;
    case "camNod": { const y0 = camLook.y; await tween(300, t => camLook.y = y0 - 0.35 * t); await tween(350, t => camLook.y = y0 - 0.35 * (1 - t)); return; }

        comp.forEach(c => { c.g.root.position.x = c.x + dx * t; c.g.root.position.z = c.z + dz * t; });
      }, t => t);
      comp.forEach(c => c.g.walking--); camWalking--;

    r.position.y = base + y;
    const sideR = -1;
    if (now < f.waveUntil) f.armR.rotation.z += ((sideR * 2.5 + Math.sin(t * 11) * 0.35) - f.armR.rotation.z) * 0.25;
    else f.armR.rotation.z += (sideR * 0.12 + (f.walking > 0 ? 0 : 0) - f.armR.rotation.z) * 0.15;
    f.armL.rotation.x = f.walking > 0 ? -Math.sin(t * 9) * 0.4 : f.armL.rotation.x * 0.85;
    const nd = (now - f.nodStart) / 900;
    if (nd >= 0 && nd < 1) f.head.rotation.x = Math.sin(nd * Math.PI * 2) * 0.32;
  }
  if (stageG.visible) {
    for (const id in stage.figs) {
      const s = stage.figs[id];
      if (s.ring.userData.pulse) { s.ring.material.opacity = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 3)); s.ring.scale.setScalar(1 + 0.08 * Math.sin(t * 3)); }
      else s.ring.scale.setScalar(1);
      const want = s.locked ? 0.25 : state.mode === "celebrate" ? 1.6 : state.selected ? (state.selected === id ? 2.2 : 0.35) : (s.c.steps[state.step] ? 0.95 : 0.4);
      s.spot.intensity += (want - s.spot.intensity) * 0.08;
      s.spot.position.x = s.root.position.x; s.spot.position.z = s.root.position.z + 2.5; s.spot.target.position.set(s.root.position.x, 0.8, s.root.position.z);
      if (s.q) s.q.position.y = 2.5 + Math.sin(t * 2 + s.fig.phase) * 0.08;
      tmpV.set(s.root.position.x, 2.35, s.root.position.z).project(cam);
      s.label.style.left = ((tmpV.x + 1) / 2 * window.innerWidth) + "px";
      s.label.style.top = ((1 - tmpV.y) / 2 * window.innerHeight) + "px";
      s.label.style.opacity = state.selected && state.selected !== id ? 0.35 : 1;
    }
    for (const tb of stage.tubes) { const m = tb.mesh.material; m.opacity += ((tb.target || 0) * (0.75 + 0.25 * Math.sin(t * 4)) - m.opacity) * 0.06; }
    stage.motes.rotation.y = Math.sin(t * 0.05) * 0.1; stage.motes.position.y = Math.sin(t * 0.4) * 0.15;
    if (particles) {
      const pos = particles.geometry.attributes.position, v = particles.userData.vel;
      for (let i = 0; i < v.length; i++) {
        v[i].y -= 0.0035; pos.array[i * 3] += v[i].x; pos.array[i * 3 + 1] += v[i].y; pos.array[i * 3 + 2] += v[i].z;
        if (pos.array[i * 3 + 1] < 0) { pos.array.set([0, 1.6, 0.5], i * 3); const a = Math.random() * 6.28, sp = 0.05 + Math.random() * 0.12; v[i].set(Math.cos(a) * sp, 0.08 + Math.random() * 0.12, Math.sin(a) * sp * 0.6); }
      }
      pos.needsUpdate = true;
    }
  }
  if (state.mode === "fp") {
    cam.position.y = eyeBase + Math.sin(t * 1.3) * 0.008 + (camWalking ? Math.abs(Math.sin(t * 8)) * 0.03 : 0);
  }
  cam.lookAt(camLook);
  R.render(scene, cam);
}

resize();
setStep(1);
$("loading").remove();
requestAnimationFrame(loop);
