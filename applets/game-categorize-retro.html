<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kategorien-Sortierer — Retro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0a1e; --panel: #1a1440; --panel-light: #2c2260;
    --ink: #f2eee0; --ink-dim: #a79fd6;
    --accent: #ff4d6d; --gold: #ffd23f; --teal: #2ec4a6; --blue: #2a7fd9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font-family: 'VT323', monospace;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 26px 18px 40px; }
  h1 { font-size: 15px; color: var(--gold); text-align: center; font-family: 'Press Start 2P', monospace; margin-bottom: 6px; }
  .sub { text-align: center; color: var(--ink-dim); font-size: 16px; margin-bottom: 20px; }
  .pool {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    background: var(--panel); border: 3px solid var(--panel-light); padding: 14px; margin-bottom: 18px;
    min-height: 56px;
  }
  .chip {
    background: var(--panel-light); border: 2px solid var(--ink); color: var(--ink);
    padding: 8px 12px; font-size: 15px; cursor: grab; box-shadow: 2px 2px 0 #000;
  }
  .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .bin {
    border: 3px dashed var(--panel-light); min-height: 140px; padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .bin h3 {
    font-family: 'Press Start 2P', monospace; font-size: 10px; text-align: center; margin: 0 0 8px;
  }
  .bin.wichtig h3 { color: var(--teal); }
  .bin.unwichtig h3 { color: var(--accent); }
  .bin.dragover { border-style: solid; }
  .check-btn {
    margin-top: 20px; width: 100%; padding: 12px;
    background: var(--accent); color: #fff; border: 3px solid var(--ink);
    font-family: 'Press Start 2P', monospace; font-size: 11px; cursor: pointer; box-shadow: 4px 4px 0 #000;
  }
  .check-btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 #000; }
  .result-msg { text-align: center; margin-top: 14px; font-size: 17px; color: var(--gold); min-height: 22px; }
  .chip.correct { outline: 2px solid var(--teal); }
  .chip.wrong { outline: 2px solid var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>KATEGORIEN-SORTIERER</h1>
  <p class="sub">Ziehe die Karten in die passende Kategorie</p>

  <div class="pool" id="pool"></div>

  <div class="bins">
    <div class="bin wichtig" data-bin="wichtig" id="bin-wichtig">
      <h3>WICHTIG</h3>
    </div>
    <div class="bin unwichtig" data-bin="unwichtig" id="bin-unwichtig">
      <h3>NICHT WICHTIG</h3>
    </div>
  </div>

  <button class="check-btn" id="check-btn">PRÜFEN</button>
  <p class="result-msg" id="result-msg"></p>
</div>
<script>
(function(){
  const items = [
    { text: 'Rauchmelder testen', bin: 'wichtig' },
    { text: 'Lieblingsfarbe wählen', bin: 'unwichtig' },
    { text: 'Wasserflasche mitnehmen', bin: 'wichtig' },
    { text: 'Sticker sammeln', bin: 'unwichtig' },
    { text: 'Fluchtweg kennen', bin: 'wichtig' },
    { text: 'Neue Emojis aussuchen', bin: 'unwichtig' }
  ];

  const pool = document.getElementById('pool');
  const bins = document.querySelectorAll('.bin');

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  shuffle(items).forEach((item) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = item.text;
    chip.draggable = true;
    chip.dataset.bin = item.bin;
    chip.addEventListener('dragstart', () => chip.classList.add('dragging'));
    chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
    pool.appendChild(chip);
  });

  [pool, ...bins].forEach((zone) => {
    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      zone.classList.add('dragover');
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('dragover');
      const dragging = document.querySelector('.dragging');
      if (dragging) zone.appendChild(dragging);
    });
  });

  document.getElementById('check-btn').addEventListener('click', () => {
    let correctCount = 0;
    document.querySelectorAll('.chip').forEach((chip) => {
      chip.classList.remove('correct', 'wrong');
      const parentBin = chip.closest('.bin');
      const placedBin = parentBin ? parentBin.dataset.bin : null;
      if (placedBin === chip.dataset.bin) {
        chip.classList.add('correct');
        correctCount++;
      } else {
        chip.classList.add('wrong');
      }
    });
    document.getElementById('result-msg').textContent = `${correctCount} von ${items.length} richtig sortiert`;
  });
})();
</script>
</body>
</html>
