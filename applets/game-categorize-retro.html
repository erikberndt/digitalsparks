<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kategorien-Sortierer — Retro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05030a;
    --ink: #f9f9f9; --ink-dim: #8b8b96;
    --violet: #6a00e0; --violet-light: #a951ed;
    --pink: #ff33a7; --green: #00ff74;
  }
  * { box-sizing: border-box; }

  @keyframes drift {
    0%   { transform: translate(0,0) scale(1); }
    100% { transform: translate(-4%, 3%) scale(1.12); }
  }
  @keyframes titleShine {
    0%, 100% { filter: drop-shadow(0 0 14px rgba(255,51,167,0.45)); }
    50%      { filter: drop-shadow(0 0 26px rgba(255,51,167,0.85)); }
  }
  @keyframes riseIn { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes goodPulse {
    0%   { box-shadow: 0 0 0 0 rgba(0,255,116,0.7); }
    100% { box-shadow: 0 0 0 14px rgba(0,255,116,0); }
  }
  @keyframes shakeX {
    10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-6px); } 40%, 60% { transform: translateX(6px); }
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
  }

  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: 'Roboto Mono', monospace; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: -20%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 55% 45% at 16% 12%, rgba(0,255,116,0.2), transparent 62%),
      radial-gradient(ellipse 55% 45% at 86% 20%, rgba(106,0,224,0.5), transparent 62%),
      radial-gradient(ellipse 50% 40% at 50% 92%, rgba(255,51,167,0.36), transparent 62%);
    animation: drift 21s ease-in-out infinite alternate;
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image:
      linear-gradient(rgba(169,81,237,0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(169,81,237,0.10) 1px, transparent 1px),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.28) 0 1px, transparent 1px 3px);
    background-size: 46px 46px, 46px 46px, 100% 3px;
    -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 35%, transparent 82%);
    mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 35%, transparent 82%);
  }

  .stage {
    position: relative; z-index: 2; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 54px 20px 22px;
  }
  .shell { width: 100%; max-width: 620px; }

  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
  .eyebrow { font-size: 9.5px; letter-spacing: 0.34em; color: var(--violet-light); margin: 0 0 7px; text-transform: uppercase; }
  h1 {
    margin: 0; font-size: clamp(20px, 4.6vw, 28px); font-weight: 700; letter-spacing: 0.05em; line-height: 1;
    background: linear-gradient(170deg, #ffffff 8%, var(--pink) 62%, var(--violet-light) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: titleShine 3.4s ease-in-out infinite;
  }
  .stat {
    min-width: 74px; padding: 8px 11px; border-radius: 11px; text-align: center; flex-shrink: 0;
    background: linear-gradient(160deg, rgba(169,81,237,0.22), rgba(10,8,18,0.86));
    border: 1px solid rgba(169,81,237,0.34); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .stat .k { display: block; font-size: 8.5px; letter-spacing: 0.2em; color: var(--ink-dim); margin-bottom: 4px; }
  .stat .v { display: block; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .pool {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-content: center;
    min-height: 92px; padding: 13px; border-radius: 15px; margin-bottom: 13px;
    background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(9,7,16,0.9));
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 30px rgba(0,0,0,0.45);
    transition: border-color 0.16s ease, box-shadow 0.16s ease;
  }
  .pool.over { border-color: rgba(169,81,237,0.9); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 0 24px rgba(169,81,237,0.5); }
  .pool:empty::after {
    content: 'ALLE KARTEN VERTEILT'; font-size: 10px; letter-spacing: 0.22em; color: var(--ink-dim);
  }

  .chip {
    padding: 9px 13px; border-radius: 10px; font-size: 13.5px; cursor: grab; user-select: none;
    background: linear-gradient(150deg, rgba(255,255,255,0.14), rgba(16,12,26,0.92));
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 6px 16px rgba(0,0,0,0.45);
    transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease, opacity 0.14s ease;
    animation: riseIn 0.35s backwards ease;
  }
  .chip:hover {
    transform: translateY(-3px); border-color: rgba(169,81,237,0.85);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 12px 26px rgba(106,0,224,0.45), 0 0 18px rgba(169,81,237,0.4);
  }
  .chip:active { cursor: grabbing; }
  .chip.dragging { opacity: 0.35; transform: scale(0.94) rotate(-2deg); }
  .chip.correct { border-color: var(--green); background: linear-gradient(150deg, rgba(0,255,116,0.28), rgba(6,26,16,0.92)); animation: goodPulse 0.65s ease; }
  .chip.wrong { border-color: var(--pink); background: linear-gradient(150deg, rgba(255,51,167,0.26), rgba(28,4,18,0.92)); animation: shakeX 0.42s ease; }

  .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bin {
    min-height: 132px; padding: 12px; border-radius: 15px;
    display: flex; flex-direction: column; gap: 8px;
    border: 1px dashed rgba(255,255,255,0.2);
    background: linear-gradient(165deg, rgba(255,255,255,0.04), rgba(8,6,14,0.86));
    transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease, transform 0.16s ease;
  }
  .bin-head { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .bin-head .ico {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    border: 1px solid rgba(255,255,255,0.22);
  }
  .bin-head .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; flex: 1; }
  .bin-head .cnt {
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px;
    background: rgba(255,255,255,0.1); color: var(--ink-dim); font-variant-numeric: tabular-nums;
  }
  .bin .drop { display: flex; flex-wrap: wrap; gap: 7px; align-content: flex-start; flex: 1; }

  .bin.yes .ico { background: linear-gradient(150deg, rgba(0,255,116,0.4), rgba(0,110,52,0.7)); }
  .bin.yes .lbl { color: var(--green); }
  .bin.yes.over {
    border-style: solid; border-color: var(--green); transform: translateY(-3px);
    background: linear-gradient(165deg, rgba(0,255,116,0.12), rgba(8,6,14,0.86));
    box-shadow: 0 0 26px rgba(0,255,116,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .bin.no .ico { background: linear-gradient(150deg, rgba(255,51,167,0.4), rgba(150,0,85,0.7)); }
  .bin.no .lbl { color: var(--pink); }
  .bin.no.over {
    border-style: solid; border-color: var(--pink); transform: translateY(-3px);
    background: linear-gradient(165deg, rgba(255,51,167,0.12), rgba(8,6,14,0.86));
    box-shadow: 0 0 26px rgba(255,51,167,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .btn {
    width: 100%; margin-top: 14px; padding: 14px; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 12px; letter-spacing: 0.16em; color: #fff;
    background: linear-gradient(150deg, var(--violet-light), var(--violet) 60%, #45009c);
    border: 1px solid rgba(255,255,255,0.26);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.32), 0 12px 30px rgba(106,0,224,0.5);
    transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease, opacity 0.14s ease;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 16px 38px rgba(106,0,224,0.68); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .msg { text-align: center; margin: 11px 0 0; min-height: 18px; font-size: 12.5px; letter-spacing: 0.06em; color: var(--ink-dim); }
  .msg.good { color: var(--green); }
  .msg.bad { color: var(--pink); }
  .hint { text-align: center; margin: 9px 0 0; font-size: 10px; letter-spacing: 0.18em; color: rgba(139,139,150,0.75); }

  .confetti { position: fixed; top: -20px; width: 9px; height: 9px; z-index: 40; pointer-events: none; animation: confettiFall 2s ease-in forwards; }

  @media (max-width: 460px) { .bins { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="stage">
  <div class="shell">
    <div class="head">
      <div>
        <p class="eyebrow">Ziehen oder antippen</p>
        <h1>KATEGORIEN-SORTIERER</h1>
      </div>
      <div class="stat"><span class="k">OFFEN</span><span class="v" id="v-left">6</span></div>
    </div>

    <div class="pool" id="pool"></div>

    <div class="bins">
      <div class="bin yes" data-bin="wichtig">
        <div class="bin-head">
          <span class="ico">✓</span><span class="lbl">WICHTIG</span><span class="cnt" id="c-yes">0</span>
        </div>
        <div class="drop"></div>
      </div>
      <div class="bin no" data-bin="unwichtig">
        <div class="bin-head">
          <span class="ico">✕</span><span class="lbl">NICHT WICHTIG</span><span class="cnt" id="c-no">0</span>
        </div>
        <div class="drop"></div>
      </div>
    </div>

    <button class="btn" id="check" disabled>PRÜFEN</button>
    <p class="msg" id="msg"></p>
    <p class="hint">TIPP: KARTE ANTIPPEN SCHIEBT SIE ZUR NÄCHSTEN KATEGORIE</p>
  </div>
</div>

<script>
(function(){
  "use strict";
  const items = [
    { text: 'Rauchmelder testen',     bin: 'wichtig' },
    { text: 'Lieblingsfarbe wählen',  bin: 'unwichtig' },
    { text: 'Wasserflasche mitnehmen',bin: 'wichtig' },
    { text: 'Sticker sammeln',        bin: 'unwichtig' },
    { text: 'Fluchtweg kennen',       bin: 'wichtig' },
    { text: 'Neue Emojis aussuchen',  bin: 'unwichtig' }
  ];

  const pool  = document.getElementById('pool');
  const bins  = [...document.querySelectorAll('.bin')];
  const drops = bins.map(b => b.querySelector('.drop'));
  const zones = [pool, ...drops];
  const check = document.getElementById('check');
  const msg   = document.getElementById('msg');
  const vLeft = document.getElementById('v-left');
  const cYes  = document.getElementById('c-yes');
  const cNo   = document.getElementById('c-no');

  let actx = null;
  function tone(freq, dur, type, vol) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol == null ? 0.13 : vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  const sDrop = () => tone(520, 0.06, 'square', 0.09);
  const sWin  = () => [523,659,784,1046,1318].forEach((f,i) => setTimeout(() => tone(f, 0.2, 'square'), i*95));
  const sPart = () => tone(660, 0.12, 'square');
  const sBad  = () => tone(150, 0.24, 'sawtooth', 0.1);

  const cc = ['#ff33a7','#a951ed','#00ff74','#6a00e0','#ffffff'];
  function confetti(n) {
    for (let i = 0; i < n; i++) {
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.left = Math.random()*100 + 'vw';
      p.style.background = cc[i % cc.length];
      p.style.animationDelay = (Math.random()*0.4) + 's';
      p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 2500);
    }
  }

  const shuffle = (a) => { a = [...a]; for (let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

  function refresh() {
    const left = pool.querySelectorAll('.chip').length;
    vLeft.textContent = left;
    cYes.textContent = drops[0].querySelectorAll('.chip').length;
    cNo.textContent  = drops[1].querySelectorAll('.chip').length;
    check.disabled = left > 0;
  }

  shuffle(items).forEach((item, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = item.text;
    chip.draggable = true;
    chip.dataset.bin = item.bin;
    chip.style.animationDelay = (i * 0.05) + 's';

    chip.addEventListener('dragstart', () => chip.classList.add('dragging'));
    chip.addEventListener('dragend',   () => { chip.classList.remove('dragging'); refresh(); });

    // Tap cycles pool -> wichtig -> unwichtig -> pool, so touch users never need to drag.
    chip.addEventListener('click', () => {
      const here = chip.parentElement;
      const next = here === pool ? drops[0] : here === drops[0] ? drops[1] : pool;
      next.appendChild(chip);
      chip.classList.remove('correct','wrong');
      sDrop(); refresh();
    });

    pool.appendChild(chip);
  });

  zones.forEach((zone) => {
    const visual = zone.closest('.bin') || zone;
    zone.addEventListener('dragover', (e) => { e.preventDefault(); visual.classList.add('over'); });
    zone.addEventListener('dragleave', () => visual.classList.remove('over'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault(); visual.classList.remove('over');
      const dragging = document.querySelector('.chip.dragging');
      if (!dragging) return;
      zone.appendChild(dragging);
      dragging.classList.remove('correct','wrong');
      sDrop(); refresh();
    });
  });

  check.addEventListener('click', () => {
    let right = 0;
    document.querySelectorAll('.chip').forEach((chip) => {
      chip.classList.remove('correct','wrong');
      void chip.offsetWidth;
      const bin = chip.closest('.bin');
      const placed = bin ? bin.dataset.bin : null;
      if (placed === chip.dataset.bin) { chip.classList.add('correct'); right++; }
      else { chip.classList.add('wrong'); }
    });

    const all = right === items.length;
    msg.textContent = all
      ? '★ Alles richtig sortiert!'
      : right + ' von ' + items.length + ' richtig — verschiebe die pinken Karten.';
    msg.className = all ? 'msg good' : 'msg bad';
    if (all) { sWin(); confetti(34); } else if (right > 0) { sPart(); } else { sBad(); }
  });

  refresh();
})();
</script>

<button id="fs-toggle-btn" type="button" aria-label="Vollbild umschalten">⛶ MAXIMIEREN</button>
<style>
  #fs-toggle-btn {
    position: fixed; top: 14px; right: 14px; z-index: 9999;
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 10px; letter-spacing: 0.12em; line-height: 1;
    padding: 10px 13px; border-radius: 9px; cursor: pointer; white-space: nowrap;
    color: #ecd9ff;
    background: linear-gradient(150deg, rgba(106,0,224,0.9), rgba(60,0,130,0.92));
    border: 1px solid rgba(169,81,237,0.75);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.24), 0 8px 22px rgba(106,0,224,0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  #fs-toggle-btn:hover { transform: translateY(-2px); filter: brightness(1.18); box-shadow: inset 0 1px 0 rgba(255,255,255,0.34), 0 12px 28px rgba(106,0,224,0.68); }
  #fs-toggle-btn:active { transform: translateY(1px); }
  #fs-toggle-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<script>
(function(){
  var btn = document.getElementById('fs-toggle-btn');
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function updateBtn(){ btn.textContent = isFs() ? '× VERLASSEN' : '⛶ MAXIMIEREN'; }
  btn.addEventListener('click', function(){
    if (!isFs()) {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  });
  document.addEventListener('fullscreenchange', updateBtn);
  document.addEventListener('webkitfullscreenchange', updateBtn);
  updateBtn();
})();
</script>
</body>
</html>
