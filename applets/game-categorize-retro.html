<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kategorien-Sortierer — Retro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000; --panel: #171a1a; --panel-light: #23282a;
    --ink: #f9f9f9; --ink-dim: #a9a9a9;
    --accent: #6a00e0; --accent-light: #a951ed; --gold: #ff33a7; --teal: #00ff74;
  }
  * { box-sizing: border-box; }
  @keyframes bgPulse {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 6px var(--gold), 0 0 16px rgba(255,51,167,0.6); }
    50% { text-shadow: 0 0 10px var(--gold), 0 0 26px rgba(255,51,167,0.9); }
  }
  @keyframes correctPulse {
    0% { box-shadow: 0 0 0 0 rgba(0,255,116,0.8); }
    100% { box-shadow: 0 0 16px 4px rgba(0,255,116,0); }
  }
  @keyframes shakeX {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(400px) rotate(540deg); opacity: 0; }
  }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(0,255,116,0.16), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,51,167,0.2), transparent 45%),
      linear-gradient(120deg, #000000, #0d0518, #000000);
    background-size: 200% 200%;
    animation: bgPulse 14s ease infinite;
    color: var(--ink);
    font-family: 'Roboto Mono', monospace;
  }
  .wrap { position: relative; max-width: 560px; margin: 0 auto; padding: 64px 18px 40px; }
  h1 { font-size: 24px; color: var(--gold); text-align: center; font-family: 'Roboto Mono', monospace; font-weight: 700; margin-bottom: 6px; letter-spacing: 1px; animation: titleGlow 3s ease-in-out infinite; }
  .sub { text-align: center; color: var(--ink-dim); font-size: 16px; margin-bottom: 20px; }
  .pool {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    background: var(--panel); border: 3px solid var(--panel-light); padding: 14px; margin-bottom: 18px;
    min-height: 56px; transition: border-color 0.15s, box-shadow 0.15s;
  }
  .pool.dragover { border-color: var(--accent-light); box-shadow: 0 0 14px 2px rgba(169,81,237,0.5); }
  .chip {
    background: var(--panel-light); border: 2px solid var(--ink); color: var(--ink);
    padding: 8px 12px; font-size: 15px; cursor: grab; box-shadow: 2px 2px 0 #000;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .chip:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 #000, 0 0 8px 1px rgba(169,81,237,0.5); border-color: var(--accent-light); }
  .chip.dragging { opacity: 0.35; transform: scale(0.94) rotate(-2deg); }
  .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .bin {
    border: 3px dashed var(--panel-light); min-height: 140px; padding: 10px;
    display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .bin h3 {
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 12px; text-align: center; margin: 0 0 8px;
  }
  .bin.wichtig h3 { color: var(--teal); }
  .bin.unwichtig h3 { color: var(--gold); }
  .bin.wichtig.dragover { border-style: solid; border-color: var(--teal); box-shadow: 0 0 16px 2px rgba(0,255,116,0.45); background: rgba(0,255,116,0.06); }
  .bin.unwichtig.dragover { border-style: solid; border-color: var(--gold); box-shadow: 0 0 16px 2px rgba(255,51,167,0.45); background: rgba(255,51,167,0.06); }
  .check-btn {
    margin-top: 20px; width: 100%; padding: 12px;
    background: var(--accent); color: #fff; border: 3px solid var(--ink);
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 13px; cursor: pointer;
    box-shadow: 4px 4px 0 #000, 0 0 14px 1px rgba(106,0,224,0.7);
  }
  .check-btn:hover { background: var(--accent-light); }
  .check-btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 #000; }
  .result-msg { text-align: center; margin-top: 14px; font-size: 17px; color: var(--gold); min-height: 22px; text-shadow: 0 0 10px rgba(255,51,167,0.6); }
  .chip.correct { outline: 2px solid var(--teal); animation: correctPulse 0.6s ease; }
  .chip.wrong { outline: 2px solid var(--gold); animation: shakeX 0.4s ease; }
  .confetti-piece { position: absolute; top: 0; width: 8px; height: 8px; pointer-events: none; animation: confettiFall 1.5s ease-in forwards; z-index: 5; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>KATEGORIEN-SORTIERER</h1>
  <p class="sub">Ziehe die Karten in die passende Kategorie</p>

  <div class="pool" id="pool"></div>

  <div class="bins">
    <div class="bin wichtig" data-bin="wichtig" id="bin-wichtig">
      <h3>WICHTIG</h3>
    </div>
    <div class="bin unwichtig" data-bin="unwichtig" id="bin-unwichtig">
      <h3>NICHT WICHTIG</h3>
    </div>
  </div>

  <button class="check-btn" id="check-btn">PRÜFEN</button>
  <p class="result-msg" id="result-msg"></p>
</div>
<script>
(function(){
  const items = [
    { text: 'Rauchmelder testen', bin: 'wichtig' },
    { text: 'Lieblingsfarbe wählen', bin: 'unwichtig' },
    { text: 'Wasserflasche mitnehmen', bin: 'wichtig' },
    { text: 'Sticker sammeln', bin: 'unwichtig' },
    { text: 'Fluchtweg kennen', bin: 'wichtig' },
    { text: 'Neue Emojis aussuchen', bin: 'unwichtig' }
  ];

  const wrap = document.getElementById('wrap');
  const pool = document.getElementById('pool');
  const bins = document.querySelectorAll('.bin');

  let actx = null;
  function beep(freq, dur, type) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(); osc.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  function sfxDrop() { beep(500, 0.06, 'square'); }
  function sfxWin() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square'), i * 100)); }
  function sfxPartial() { beep(660, 0.12, 'square'); }
  function sfxMiss() { beep(160, 0.24, 'sawtooth'); }

  const confettiColors = ['#ff33a7', '#a951ed', '#00ff74', '#6a00e0', '#f9f9f9'];
  function burstConfetti(count) {
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.background = confettiColors[i % confettiColors.length];
      piece.style.animationDelay = (Math.random() * 0.2) + 's';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      wrap.appendChild(piece);
      setTimeout(() => piece.remove(), 1800);
    }
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  shuffle(items).forEach((item) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = item.text;
    chip.draggable = true;
    chip.dataset.bin = item.bin;
    chip.addEventListener('dragstart', () => chip.classList.add('dragging'));
    chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
    pool.appendChild(chip);
  });

  [pool, ...bins].forEach((zone) => {
    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      zone.classList.add('dragover');
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('dragover');
      const dragging = document.querySelector('.dragging');
      if (dragging) { zone.appendChild(dragging); sfxDrop(); }
    });
  });

  document.getElementById('check-btn').addEventListener('click', () => {
    let correctCount = 0;
    document.querySelectorAll('.chip').forEach((chip) => {
      chip.classList.remove('correct', 'wrong');
      void chip.offsetWidth;
      const parentBin = chip.closest('.bin');
      const placedBin = parentBin ? parentBin.dataset.bin : null;
      if (placedBin === chip.dataset.bin) {
        chip.classList.add('correct');
        correctCount++;
      } else {
        chip.classList.add('wrong');
      }
    });
    document.getElementById('result-msg').textContent = `${correctCount} von ${items.length} richtig sortiert`;
    if (correctCount === items.length) { sfxWin(); burstConfetti(26); }
    else if (correctCount > 0) { sfxPartial(); }
    else { sfxMiss(); }
  });
})();
</script>
<button id="fs-toggle-btn" type="button" aria-label="Vollbild umschalten">⛶ MAXIMIEREN</button>
<style>
  #fs-toggle-btn {
    position: fixed; top: 10px; right: 10px; z-index: 9999;
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 11px; line-height: 1;
    padding: 9px 11px; background: #171a1a; color: #a951ed;
    border: 2px solid #a951ed; box-shadow: 3px 3px 0 #000; cursor: pointer;
    white-space: nowrap;
  }
  #fs-toggle-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #000; }
  #fs-toggle-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<script>
(function(){
  var btn = document.getElementById('fs-toggle-btn');
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function updateBtn(){ btn.textContent = isFs() ? '× VERLASSEN' : '⛶ MAXIMIEREN'; }
  btn.addEventListener('click', function(){
    if (!isFs()) {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  });
  document.addEventListener('fullscreenchange', updateBtn);
  document.addEventListener('webkitfullscreenchange', updateBtn);
  updateBtn();
})();
</script>
</body>
</html>
