<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Segel-Vorschau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @keyframes hudGlow {
    0%, 100% { text-shadow: 2px 2px 0 rgba(0,0,0,0.6), 0 0 10px rgba(255,51,167,0.6); }
    50% { text-shadow: 2px 2px 0 rgba(0,0,0,0.6), 0 0 18px rgba(255,51,167,1); }
  }
  html, body {
    margin: 0; padding: 0; overflow: hidden; background: #04101c;
    font-family: 'Roboto Mono', monospace; color: #e7f4ff;
  }
  #scene { position: fixed; inset: 0; cursor: pointer; }
  .hud {
    position: fixed; top: 14px; left: 14px; z-index: 5;
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 16px; color: #ff33a7;
    animation: hudGlow 2.4s ease-in-out infinite; letter-spacing: 1px;
  }
  .wind-wrap {
    position: fixed; top: 44px; left: 14px; z-index: 5; width: 160px;
  }
  .wind-label { font-size: 11px; color: #a951ed; margin-bottom: 4px; text-shadow: 1px 1px 0 rgba(0,0,0,0.6); }
  .wind-track { height: 8px; background: rgba(255,255,255,0.12); border: 2px solid #e7f4ff; }
  .wind-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6a00e0, #a951ed, #ff33a7); transition: width 0.15s linear; box-shadow: 0 0 8px 1px rgba(255,51,167,0.7); }
  .hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 17px; color: #9fd6ff; z-index: 5; text-align: center;
  }
</style>
</head>
<body>
<div id="scene"></div>
<div class="hud">SEGEL-VORSCHAU</div>
<div class="wind-wrap">
  <div class="wind-label">WIND</div>
  <div class="wind-track"><div class="wind-fill" id="wind-fill"></div></div>
</div>
<p class="hint">Ziehen, um die Ansicht zu drehen &middot; Tippen, um Segel zu hissen</p>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const container = document.getElementById('scene');
const windFill = document.getElementById('wind-fill');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a2540);
scene.fog = new THREE.Fog(0x0a2540, 10, 40);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 4, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

let actx = null;
function beep(freq, dur, type, vol) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, actx.currentTime);
    gain.gain.setValueAtTime(vol || 0.12, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + dur);
  } catch (e) {}
}
function sfxBoost() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, actx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(520, actx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.1, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.4);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + 0.4);
  } catch (e) {}
}

// Lighting
const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x0a2540, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe9b0, 1.2);
sun.position.set(6, 8, 3);
scene.add(sun);
const magicLight = new THREE.PointLight(0xa951ed, 0, 8);
magicLight.position.set(0, 2.5, 0);
scene.add(magicLight);

// Ocean plane with animated vertices
const oceanGeo = new THREE.PlaneGeometry(60, 60, 60, 60);
oceanGeo.rotateX(-Math.PI / 2);
const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1f6fa8, roughness: 0.35, metalness: 0.1, flatShading: true });
const ocean = new THREE.Mesh(oceanGeo, oceanMat);
scene.add(ocean);
const oceanPos = oceanGeo.attributes.position;
const basePositions = Float32Array.from(oceanPos.array);

// Sparkling water glints (brand-colored points)
const sparkleCount = 260;
const sparkleGeo = new THREE.BufferGeometry();
const sparklePos = new Float32Array(sparkleCount * 3);
for (let i = 0; i < sparkleCount; i++) {
  sparklePos[i * 3] = (Math.random() - 0.5) * 50;
  sparklePos[i * 3 + 1] = 0.15;
  sparklePos[i * 3 + 2] = (Math.random() - 0.5) * 50;
}
sparkleGeo.setAttribute('position', new THREE.BufferAttribute(sparklePos, 3));
const sparkleMat = new THREE.PointsMaterial({ color: 0xa951ed, size: 0.11, transparent: true, opacity: 0.7, depthWrite: false });
const sparkles = new THREE.Points(sparkleGeo, sparkleMat);
scene.add(sparkles);
const sparkleHues = [0xa951ed, 0xff33a7, 0x00ff74, 0x6a00e0];

// Simple low-poly boat: hull + mast + sail
const boat = new THREE.Group();

const hullGeo = new THREE.CylinderGeometry(0.05, 0.6, 2.6, 8, 1, false);
hullGeo.rotateZ(Math.PI / 2);
const hullMat = new THREE.MeshStandardMaterial({ color: 0x8a5a34, roughness: 0.7 });
const hull = new THREE.Mesh(hullGeo, hullMat);
hull.position.y = 0.25;
boat.add(hull);

const deckGeo = new THREE.BoxGeometry(2.2, 0.15, 0.9);
const deckMat = new THREE.MeshStandardMaterial({ color: 0xd8c39a, roughness: 0.8 });
const deck = new THREE.Mesh(deckGeo, deckMat);
deck.position.y = 0.5;
boat.add(deck);

const mastGeo = new THREE.CylinderGeometry(0.04, 0.04, 2.4, 8);
const mastMat = new THREE.MeshStandardMaterial({ color: 0x3a2410 });
const mast = new THREE.Mesh(mastGeo, mastMat);
mast.position.set(0, 1.7, 0);
boat.add(mast);

const sailGeo = new THREE.PlaneGeometry(1.2, 1.7);
const sailMat = new THREE.MeshStandardMaterial({
  color: 0xf6f1e4, side: THREE.DoubleSide, roughness: 0.9,
  emissive: new THREE.Color(0xff33a7), emissiveIntensity: 0
});
const sail = new THREE.Mesh(sailGeo, sailMat);
sail.position.set(0.02, 1.7, 0);
sail.rotation.y = Math.PI / 2.3;
boat.add(sail);

scene.add(boat);

// Wake particle trail
const wakeParticles = [];
function spawnWake(intensity) {
  const geo = new THREE.CircleGeometry(0.12 + Math.random() * 0.1 * intensity, 8);
  const mat = new THREE.MeshBasicMaterial({ color: 0xbfe6ff, transparent: true, opacity: 0.55 * intensity });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(boat.position.x - 1.1, 0.16, boat.position.z);
  scene.add(mesh);
  wakeParticles.push({ mesh, life: 0, maxLife: 1.2 });
}

// Orbit-ish manual controls (drag to rotate camera around origin)
let isDragging = false;
let prevX = 0, prevY = 0, downX = 0, downY = 0, downT = 0;
let theta = 0.4, phi = 1.15;
let radius = 10;
let boost = 0;

function updateCamera() {
  const r = radius - boost * 0.8;
  camera.position.x = r * Math.sin(phi) * Math.sin(theta);
  camera.position.y = r * Math.cos(phi) + 2;
  camera.position.z = r * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(0, 0.5, 0);
}
updateCamera();

function triggerBoost() {
  boost = Math.min(1, boost + 0.35);
  sfxBoost();
  for (let i = 0; i < 6; i++) spawnWake(1);
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  isDragging = true; prevX = e.clientX; prevY = e.clientY;
  downX = e.clientX; downY = e.clientY; downT = performance.now();
});
window.addEventListener('pointerup', (e) => {
  isDragging = false;
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  const dt = performance.now() - downT;
  if (moved < 6 && dt < 350) triggerBoost();
});
window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  theta -= dx * 0.008;
  phi = Math.min(Math.max(phi - dy * 0.006, 0.5), 1.5);
  prevX = e.clientX; prevY = e.clientY;
  updateCamera();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
let autoSpin = true;
renderer.domElement.addEventListener('pointerdown', () => { autoSpin = false; });

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  boost = Math.max(0, boost - dt * 0.18);
  windFill.style.width = (boost * 100) + '%';
  sailMat.emissiveIntensity = boost * 0.9;
  magicLight.intensity = boost * 1.4;

  const speedMul = 1 + boost * 2.2;

  // animate ocean waves
  for (let i = 0; i < oceanPos.count; i++) {
    const x = basePositions[i * 3];
    const z = basePositions[i * 3 + 2];
    const y = Math.sin(x * 0.4 + t * speedMul) * 0.18 + Math.cos(z * 0.35 + t * 0.8 * speedMul) * 0.14;
    oceanPos.setY(i, y);
  }
  oceanPos.needsUpdate = true;
  oceanGeo.computeVertexNormals();

  // sparkle shimmer: pulse opacity and cycle hue
  sparkleMat.opacity = 0.45 + Math.sin(t * 2) * 0.25 + boost * 0.2;
  const hue = sparkleHues[Math.floor(t * 0.6) % sparkleHues.length];
  sparkleMat.color.lerp(new THREE.Color(hue), 0.02);

  // bob the boat with the nearest wave approximation
  boat.position.y = Math.sin(t * speedMul) * 0.18 + Math.cos(t * 0.8 * speedMul) * 0.1;
  boat.rotation.z = Math.sin(t * 0.7 * speedMul) * 0.05;
  boat.rotation.x = Math.cos(t * 0.6 * speedMul) * 0.04;

  if (boost > 0.05 && Math.random() < boost * 0.6) spawnWake(boost);
  for (let i = wakeParticles.length - 1; i >= 0; i--) {
    const p = wakeParticles[i];
    p.life += dt;
    const k = p.life / p.maxLife;
    p.mesh.scale.setScalar(1 + k * 2.2);
    p.mesh.material.opacity = Math.max(0, 0.55 * (1 - k));
    if (p.life >= p.maxLife) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      wakeParticles.splice(i, 1);
    }
  }

  if (autoSpin) {
    theta += 0.0022 * speedMul;
  }
  updateCamera();

  renderer.render(scene, camera);
}
animate();
</script>
<button id="fs-toggle-btn" type="button" aria-label="Vollbild umschalten">⛶ MAXIMIEREN</button>
<style>
  #fs-toggle-btn {
    position: fixed; top: 10px; right: 10px; z-index: 9999;
    font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 11px; line-height: 1;
    padding: 9px 11px; background: #171a1a; color: #a951ed;
    border: 2px solid #a951ed; box-shadow: 3px 3px 0 #000; cursor: pointer;
    white-space: nowrap;
  }
  #fs-toggle-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #000; }
  #fs-toggle-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<script>
(function(){
  var btn = document.getElementById('fs-toggle-btn');
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function updateBtn(){ btn.textContent = isFs() ? '× VERLASSEN' : '⛶ MAXIMIEREN'; }
  btn.addEventListener('click', function(){
    if (!isFs()) {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  });
  document.addEventListener('fullscreenchange', updateBtn);
  document.addEventListener('webkitfullscreenchange', updateBtn);
  updateBtn();
})();
</script>
</body>
</html>
