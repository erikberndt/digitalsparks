<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernreise – Schritte-Leiste, Tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#C9B6FF}a:hover{color:#E2D8FF}
</style>
</helmet>
<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Manrope', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="30">
<span style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.r}}px; height: {{s.r}}px; border-radius: 50%; background: #FFFFFF; opacity: {{s.o}}"></span>
</sc-for>
</div>

<header style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 26px 40px 0">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.1">Climate CO<span style="font-size: 0.6em; vertical-align: -0.3em">2</span>llaboration</h1>
<div style="display: flex; align-items: center; gap: 10px">
<button style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 22px; border-radius: 999px; border: 1px solid #3A3A3A; background: #1A1A1A; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9B6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h20"></path><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"></path><path d="m7 21 5-5 5 5"></path></svg>Showroom</button>
<button style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 22px; border-radius: 999px; border: 1px solid #3A3A3A; background: #1A1A1A; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9B6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6 4 14"></path><path d="M12 6v14"></path><path d="M8 8v12"></path><path d="M4 4v16"></path></svg>Bibliothek</button>
<span aria-hidden="true" style="width: 1px; height: 28px; margin: 0 6px; background: #333333"></span>
<button onClick="{{toggleTools}}" aria-expanded="{{toolsExp}}" style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 18px; border-radius: 999px; border: 1px solid {{toolsBorder}}; background: {{toolsBg}}; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Werkzeuge<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
</header>

<main style="position: relative; flex: 1; min-height: 0; padding: 56px 40px 150px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Schritt {{stepNum}} von 4 · {{countLabel}}</span>
<h2 style="margin: 0; font-size: 64px; line-height: 1; font-weight: 800; letter-spacing: -0.02em">{{phaseName}}</h2>
</div>

<sc-if value="{{isIntro}}" hint-placeholder-val="{{ false }}">
<button style="max-width: 640px; display: flex; align-items: center; gap: 18px; padding: 16px; border-radius: 26px; background: #1A1528; border: 1px solid {{accent}}; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer">
<span style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 18px; background: #3A3A3A; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">5'</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #C9B6FF">Hi · jetzt dran</span><span style="font-size: 22px; font-weight: 700">Überblick &amp; Teamname</span></span>
<span style="width: 52px; height: 52px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></span>
</button>
</sc-if>

<sc-if value="{{hasCards}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{modules}}" as="m" hint-placeholder-count="4">
<button style="display: flex; flex-direction: column; justify-content: space-between; gap: 20px; min-height: 168px; padding: 20px; border-radius: 24px; background: #121212; border: 1px solid #2E2E2E; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer">
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 44px; line-height: 1; color: #8A8A8A">{{m.num}}</span>
<span style="font-size: 19px; font-weight: 700; line-height: 1.25">{{m.title}}</span>
</button>
</sc-for>
</div>
</sc-if>
</main>

<nav aria-label="Schritte der Lernreise" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 8px; border-radius: 44px; background: #141414; border: 1px solid #2E2E2E">
<sc-for list="{{steps}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.pick}}" aria-current="{{t.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 24px 0 12px; border-radius: 36px; border: none; background: {{t.bg}}; color: {{t.color}}; font: inherit; text-align: left; cursor: pointer">
<span style="width: 36px; height: 36px; border-radius: 50%; background: {{t.numBg}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: #FFFFFF">{{t.n}}</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 800">{{t.name}}</span><span style="font-size: 12px; font-weight: 600; color: {{t.subColor}}">{{t.count}}</span></span>
</button>
</sc-for>
</nav>
<sc-if value="{{toolsOpen}}" hint-placeholder-val="{{ false }}">
<button onClick="{{closeTools}}" aria-label="Werkzeuge schließen" style="position: absolute; inset: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.35); border: none; cursor: pointer"></button>
<section aria-label="Werkzeuge" style="position: absolute; top: 90px; right: 40px; width: 280px; padding: 8px; box-sizing: border-box; border-radius: 22px; background: #161616; border: 1px solid #333333; display: flex; flex-direction: column; gap: 2px">
<button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 14px; border-radius: 14px; border: none; background: none; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9B6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 15.5a2 2 0 0 0-1.4-1.4l-6.1-1.6a.5.5 0 0 1 0-1l6.1-1.6a2 2 0 0 0 1.4-1.4l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path></svg>Spark</button>
<button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 14px; border-radius: 14px; border: none; background: none; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"></path><path d="M14 10V4a2 2 0 0 0-4 0v2"></path><path d="M10 10.5V6a2 2 0 0 0-4 0v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"></path></svg>Klasse</button>
<button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 14px; border-radius: 14px; border: none; background: none; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg>Optionen</button>
<button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 14px; border-radius: 14px; border: none; background: none; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>Handbuch</button>
<span aria-hidden="true" style="height: 1px; margin: 6px 10px; background: #2E2E2E"></span>
<button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 14px; border-radius: 14px; border: none; background: none; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>Verlassen</button>
</section>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E44D9","options":["#6E44D9","#1F6FEB","#C2410C","#0F766E"]},"startPhase":{"editor":"enum","default":"discover","options":["intro","discover","create","share"]},"toolsOpen":{"editor":"boolean","default":false},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  makeStars(seed, count, w, h) {
    let s = seed;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const out = [];
    for (let i = 0; i < count; i++) {
      const big = r() > 0.88;
      out.push({ x: Math.round(r() * w), y: Math.round(r() * h), r: big ? 3 : (r() > 0.5 ? 2 : 1), o: (0.2 + r() * 0.5).toFixed(2) });
    }
    return out;
  }
  renderVals() {
    const accent = this.props.accent ?? '#6E44D9';
    const order = ['intro', 'discover', 'create', 'share'];
    const names = { intro: 'Intro', discover: 'Discover', create: 'Create', share: 'Share' };
    const data = {
      intro: [],
      discover: [
        { num: '01', title: 'Der Klimawandel' },
        { num: '02', title: 'Klimagerechtigkeit' },
        { num: '03', title: 'Die Denkweise der Gegenwart' },
        { num: '04', title: 'Alternative Zukünfte' }
      ],
      create: [
        { num: '05', title: 'Ideenfindung' },
        { num: '06', title: 'Projektstart' },
        { num: '07', title: 'Projektabschluss' }
      ],
      share: [{ num: '08', title: 'Ergebnisse teilen' }]
    };
    const counts = { intro: '1 Modul', discover: '4 Module', create: '3 Module', share: '1 Modul' };
    const st = this.state || {};
    const phase = st.phase ?? (this.props.startPhase ?? 'discover');
    const steps = order.map((k, i) => {
      const on = k === phase;
      return {
        n: String(i + 1), name: names[k], count: counts[k],
        pick: () => this.setState({ phase: k }),
        current: on ? 'step' : 'false',
        bg: on ? accent : 'transparent',
        color: on ? '#FFFFFF' : '#D4D4D4',
        numBg: on ? 'rgba(0,0,0,0.25)' : '#2A2A2A',
        subColor: on ? '#EDE7FF' : '#A3A3A3'
      };
    });
    const toolsOpen = st.tools ?? (this.props.toolsOpen ?? false);
    return {
      toolsOpen,
      toolsExp: String(toolsOpen),
      toolsBg: toolsOpen ? '#262626' : '#111111',
      toolsBorder: toolsOpen ? '#5A5A5A' : '#333333',
      toggleTools: () => this.setState({ tools: !toolsOpen }),
      closeTools: () => this.setState({ tools: false }),
      accent,
      stars: this.makeStars(17, 60, 1180, 820),
      steps,
      stepNum: order.indexOf(phase) + 1,
      phaseName: names[phase],
      countLabel: counts[phase],
      isIntro: phase === 'intro',
      hasCards: data[phase].length > 0,
      modules: data[phase]
    };
  }
}
</script>
</body>
</html>
