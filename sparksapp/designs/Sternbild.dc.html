<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernreise – Sternbild-Karte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#C9B6FF}a:hover{color:#E2D8FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Manrope', 'Helvetica Neue', system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="20">
<span style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.r}}px; height: {{s.r}}px; border-radius: 50%; background: #FFFFFF; opacity: {{s.o}}"></span>
</sc-for>
</div>

<header style="position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 20px 0">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.1">Climate CO<span style="font-size: 0.6em; vertical-align: -0.3em">2</span>llaboration</h1>
<div style="display: flex; gap: 8px">
<button aria-label="Klasse" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #333333; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"></path><path d="M14 10V4a2 2 0 0 0-4 0v2"></path><path d="M10 10.5V6a2 2 0 0 0-4 0v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"></path></svg></button>
<button aria-label="Verlassen" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #333333; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg></button>
</div>
</header>

<div aria-label="Phasen" style="position: absolute; left: 20px; right: 20px; top: 78px; display: flex; gap: 6px">
<sc-for list="{{phases}}" as="p" hint-placeholder-count="4">
<span style="padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{p.bg}}; border: 1px solid {{p.border}}; color: {{p.color}}">{{p.name}}</span>
</sc-for>
</div>

<svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; pointer-events: none"><polyline points="{{linePoints}}" fill="none" stroke="#3A3A3A" stroke-width="1.5" stroke-dasharray="4 6"></polyline></svg>

<sc-for list="{{nodes}}" as="n" hint-placeholder-count="9">
<button onClick="{{n.pick}}" aria-label="{{n.aria}}" aria-pressed="{{n.pressed}}" style="position: absolute; left: {{n.left}}px; top: {{n.top}}px; width: 44px; height: 44px; border-radius: 50%; padding: 0; background: {{n.bg}}; border: 1px solid {{n.border}}; box-shadow: {{n.ring}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer">{{n.num}}</button>
<span style="position: absolute; left: {{n.labelLeft}}px; top: {{n.labelTop}}px; width: 160px; text-align: {{n.align}}; font-size: 13px; font-weight: 700; line-height: 1.3; color: {{n.labelColor}}; pointer-events: none">{{n.title}}</span>
</sc-for>

<section aria-label="Ausgewähltes Modul" style="position: absolute; left: 0; right: 0; bottom: 0; height: 250px; box-sizing: border-box; padding: 10px 20px 30px; border-radius: 28px 28px 0 0; background: #121212; border-top: 1px solid #2E2E2E; display: flex; flex-direction: column; gap: 14px">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3A3A3A"></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">{{selPhase}} · {{selCount}}</span>
<h2 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em">{{selTitle}}</h2>
</div>
<sc-if value="{{selHasStep}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 16px; background: #1E1E1E">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #3A3A3A; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">5'</span>
<span style="font-size: 15px; font-weight: 700">Überblick &amp; Teamname</span>
</div>
</sc-if>
<div style="margin-top: auto; display: flex; gap: 8px">
<button style="flex: 1; min-height: 52px; border-radius: 999px; border: none; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>Starten</button>
<button aria-label="Spark" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid #333333; background: #1A1A1A; color: #C9B6FF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 15.5a2 2 0 0 0-1.4-1.4l-6.1-1.6a.5.5 0 0 1 0-1l6.1-1.6a2 2 0 0 0 1.4-1.4l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path></svg></button>
<button aria-label="Optionen" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid #333333; background: #1A1A1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg></button>
<button aria-label="Handbuch" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid #333333; background: #1A1A1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg></button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E44D9","options":["#6E44D9","#1F6FEB","#C2410C","#0F766E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  makeStars(seed, count, w, h) {
    let s = seed;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const out = [];
    for (let i = 0; i < count; i++) {
      const big = r() > 0.85;
      out.push({ x: Math.round(r() * w), y: Math.round(r() * h), r: big ? 3 : (r() > 0.5 ? 2 : 1), o: (0.2 + r() * 0.6).toFixed(2) });
    }
    return out;
  }
  renderVals() {
    const accent = this.props.accent ?? '#6E44D9';
    const mods = [
      { num: 'Hi', title: 'Intro', phase: 'Intro', x: 195, y: 140 },
      { num: '1', title: 'Der Klimawandel', phase: 'Discover', x: 84, y: 198 },
      { num: '2', title: 'Klimagerechtigkeit', phase: 'Discover', x: 290, y: 244 },
      { num: '3', title: 'Die Denkweise der Gegenwart', phase: 'Discover', x: 104, y: 298 },
      { num: '4', title: 'Alternative Zukünfte', phase: 'Discover', x: 282, y: 346 },
      { num: '5', title: 'Ideenfindung', phase: 'Create', x: 92, y: 396 },
      { num: '6', title: 'Projektstart', phase: 'Create', x: 294, y: 440 },
      { num: '7', title: 'Projektabschluss', phase: 'Create', x: 120, y: 490 },
      { num: '8', title: 'Ergebnisse teilen', phase: 'Share', x: 300, y: 536 }
    ];
    const st = this.state || {};
    const sel = st.sel ?? 0;
    const cur = mods[sel];
    const nodes = mods.map((m, i) => {
      const isSel = i === sel;
      const isNow = i === 0;
      const right = m.x > 195;
      return {
        num: m.num,
        title: m.title,
        aria: m.phase + ': ' + m.title,
        pressed: String(isSel),
        pick: () => this.setState({ sel: i }),
        left: m.x - 22,
        top: m.y - 22,
        bg: isSel ? accent : (isNow ? '#1A1528' : '#141414'),
        border: isSel ? accent : (isNow ? accent : '#3A3A3A'),
        ring: isSel ? '0 0 0 6px rgba(110, 68, 217, 0.28)' : 'none',
        labelLeft: right ? m.x - 30 - 160 : m.x + 30,
        labelTop: m.y - 9,
        align: right ? 'right' : 'left',
        labelColor: isSel ? '#FFFFFF' : '#BDBDBD'
      };
    });
    const phaseNames = ['Intro', 'Discover', 'Create', 'Share'];
    const phases = phaseNames.map((p) => ({
      name: p,
      bg: p === cur.phase ? accent : '#141414',
      border: p === cur.phase ? accent : '#2E2E2E',
      color: p === cur.phase ? '#FFFFFF' : '#BDBDBD'
    }));
    return {
      accent,
      stars: this.makeStars(42, 52, 390, 600),
      linePoints: mods.map((m) => m.x + ',' + m.y).join(' '),
      nodes,
      phases,
      selPhase: cur.phase,
      selCount: sel === 0 ? 'Start' : 'Modul ' + cur.num + ' von 8',
      selTitle: sel === 0 ? 'Hi – willkommen' : cur.title,
      selHasStep: sel === 0
    };
  }
}
</script>
</body>
</html>
