<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernreise – Quick Fix, Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#C9B6FF}a:hover{color:#E2D8FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Manrope', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="20">
<span style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.r}}px; height: {{s.r}}px; border-radius: 50%; background: #FFFFFF; opacity: {{s.o}}"></span>
</sc-for>
</div>

<h1 style="position: relative; margin: 0; padding: 20px 20px 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.1; letter-spacing: -0.01em">Climate CO<span style="font-size: 0.55em; vertical-align: -0.35em">2</span>llaboration</h1>

<div style="position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 22px 20px 116px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; font-weight: 700">Intro</h2>
<div style="display: flex; align-items: center; gap: 12px; padding: 6px; border-radius: 26px; background: #262626; border: 1px solid #3A3A3A">
<button onClick="{{openHi}}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Hi</button>
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #6B6B6B; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">5'</span>
<span style="font-size: 15px; font-weight: 600">Überblick &amp; Teamname</span>
</div>

<div style="margin-top: 14px; display: flex; align-items: center; gap: 14px"><span style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; background: #141414; border: 1px solid #333333; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg></span><h2 style="margin: 0; font-size: 24px; font-weight: 700">Discover</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips.discover}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3A3A; background: #141414; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>

<div style="margin-top: 14px; display: flex; align-items: center; gap: 14px"><span style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; background: #141414; border: 1px solid #333333; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></span><h2 style="margin: 0; font-size: 24px; font-weight: 700">Create</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips.create}}" as="c" hint-placeholder-count="3">
<button onClick="{{c.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3A3A; background: #141414; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>

<div style="margin-top: 14px; display: flex; align-items: center; gap: 14px"><span style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; background: #141414; border: 1px solid #333333; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg></span><h2 style="margin: 0; font-size: 24px; font-weight: 700">Share</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips.share}}" as="c" hint-placeholder-count="1">
<button onClick="{{c.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3A3A; background: #141414; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>

<nav aria-label="Werkzeuge" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 4px 26px; background: #111111; border-top: 1.5px solid #3A3A3A">
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 15.5a2 2 0 0 0-1.4-1.4l-6.1-1.6a.5.5 0 0 1 0-1l6.1-1.6a2 2 0 0 0 1.4-1.4l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path></svg>Spark</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"></path><path d="M14 10V4a2 2 0 0 0-4 0v2"></path><path d="M10 10.5V6a2 2 0 0 0-4 0v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"></path></svg>Klasse</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg>Optionen</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>Handbuch</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>Verlassen</button>
</nav>
<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.65)">
<button onClick="{{close}}" aria-label="Schließen" style="position: absolute; inset: 0; width: 100%; height: 100%; background: none; border: none; cursor: pointer"></button>
<section aria-label="Unterkapitel" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 34px; border-radius: 28px 28px 0 0; background: #141414; border-top: 1.5px solid #3A3A3A; display: flex; flex-direction: column; gap: 10px">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3A3A3A"></span>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 6px 0 6px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">{{selPhase}}</span>
<h2 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700">{{selTitle}}</h2>
</div>
<button onClick="{{close}}" aria-label="Schließen" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: #262626; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
<sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
<button style="display: flex; align-items: center; gap: 12px; padding: 6px; border-radius: 26px; background: #262626; border: 1px solid #3A3A3A; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #6B6B6B; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">{{st.t}}</span>
<span style="font-size: 16px; font-weight: 600">{{st.title}}</span>
</button>
</sc-for>
</section>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E44D9","options":["#6E44D9","#1F6FEB","#C2410C","#0F766E"]},"openChapter":{"editor":"enum","default":"keins","options":["keins","hi","1","2","3","4","5","6","7","8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  makeStars(seed, count, w, h) {
    let s = seed;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const out = [];
    for (let i = 0; i < count; i++) {
      const big = r() > 0.88;
      out.push({ x: Math.round(r() * w), y: Math.round(r() * h), r: big ? 3 : (r() > 0.5 ? 2 : 1), o: (0.2 + r() * 0.6).toFixed(2) });
    }
    return out;
  }
  renderVals() {
    const chapters = [
      { id: '1', label: '1. Der Klimawandel', phase: 'discover' },
      { id: '2', label: '2. Klimagerechtigkeit', phase: 'discover' },
      { id: '3', label: '3. Die Denkweise der Gegenwart', phase: 'discover' },
      { id: '4', label: '4. Alternative Zukünfte', phase: 'discover' },
      { id: '5', label: '5. Ideenfindung', phase: 'create' },
      { id: '6', label: '6. Projektstart', phase: 'create' },
      { id: '7', label: '7. Projektabschluss', phase: 'create' },
      { id: '8', label: '8. Ergebnisse teilen', phase: 'share' }
    ];
    const names = { discover: 'Discover', create: 'Create', share: 'Share' };
    const st = this.state || {};
    const sel = st.sel ?? (this.props.openChapter ?? 'keins');
    const chips = { discover: [], create: [], share: [] };
    chapters.forEach((c) => chips[c.phase].push({ label: c.label, pick: () => this.setState({ sel: c.id }) }));
    const cur = chapters.find((c) => c.id === sel);
    const steps = cur
      ? [1, 2, 3, 4].map((n) => ({ t: '–\'', title: '[Unterkapitel ' + cur.id + '.' + n + ']' }))
      : [{ t: '5\'', title: 'Überblick & Teamname' }];
    return {
      accent: this.props.accent ?? '#6E44D9',
      stars: this.makeStars(13, 44, 390, 844),
      chips,
      openHi: () => this.setState({ sel: 'hi' }),
      close: () => this.setState({ sel: 'keins' }),
      sheetOpen: sel !== 'keins',
      selPhase: cur ? names[cur.phase] : 'Intro',
      selTitle: cur ? cur.label : 'Hi',
      steps
    };
  }
}
</script>
</body>
</html>
