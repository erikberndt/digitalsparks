<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Als Lehrer*in registrieren (App)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#C9B6FF}a:hover{color:#E2D8FF}
input::placeholder{color:#8A8A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Manrope', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; padding: 0 20px; box-sizing: border-box">

<div style="display: flex; align-items: center; min-height: 64px; padding-top: 8px">
<a href="F2-Login.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m11 18-6-6 6-6"></path></svg></a>
</div>

<h1 style="margin: 8px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.05; letter-spacing: -0.01em">Als Lehrer✦in registrieren</h1>
<div style="margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #1A1528; color: #E2D8FF; font-size: 13px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Kostenlos</span>
<span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #1A1528; color: #E2D8FF; font-size: 13px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Spendenfinanziert</span>
<span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #1A1528; color: #E2D8FF; font-size: 13px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Alle Lernreisen</span>
</div>

<div style="margin-top: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="reg-name" style="font-size: 14px; font-weight: 700">Name</label>
<input id="reg-name" type="text" autocomplete="name" placeholder="Vor- und Nachname" style="height: 54px; padding: 0 16px; border-radius: 16px; border: 1px solid #3A3A3A; background: #161616; color: #FFFFFF; font: inherit; font-size: 16px; outline-color: {{accent}}">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="reg-email" style="font-size: 14px; font-weight: 700">E-Mail</label>
<input id="reg-email" type="email" autocomplete="email" inputmode="email" placeholder="z. B. anna@schule.de" style="height: 54px; padding: 0 16px; border-radius: 16px; border: 1px solid #3A3A3A; background: #161616; color: #FFFFFF; font: inherit; font-size: 16px; outline-color: {{accent}}">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="reg-pw" style="font-size: 14px; font-weight: 700">Passwort</label>
<div style="position: relative">
<input id="reg-pw" type="{{pwType}}" autocomplete="new-password" placeholder="Passwort wählen" style="width: 100%; box-sizing: border-box; height: 54px; padding: 0 56px 0 16px; border-radius: 16px; border: 1px solid #3A3A3A; background: #161616; color: #FFFFFF; font: inherit; font-size: 16px; outline-color: {{accent}}">
<button onClick="{{togglePw}}" aria-label="{{pwLabel}}" style="position: absolute; right: 5px; top: 5px; width: 44px; height: 44px; border-radius: 12px; border: none; background: none; color: #BDBDBD; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
</div>

<label style="margin-top: 18px; display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; font-weight: 600; color: #D4D4D4; cursor: pointer">
<input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: {{accent}}">
Schick mir gelegentlich Neuigkeiten
</label>

<button style="margin-top: auto; min-height: 56px; border-radius: 999px; border: none; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer">Kostenlos registrieren</button>
<p style="margin: 12px 0 0; text-align: center; font-size: 13px; line-height: 1.45; color: #A3A3A3">Mit der Registrierung akzeptierst du die <a href="#">Nutzungsbedingungen</a> und die <a href="#">Datenschutzerklärung</a>.</p>
<p style="margin: 14px 0 34px; text-align: center; font-size: 15px; font-weight: 600; color: #BDBDBD">Schon ein Konto? <a href="F2-Login.dc.html" style="font-weight: 800">Anmelden</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E44D9","options":["#6E44D9","#1F6FEB","#C2410C","#0F766E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const show = st.show ?? false;
    return {
      accent: this.props.accent ?? '#6E44D9',
      pwType: show ? 'text' : 'password',
      pwLabel: show ? 'Passwort verbergen' : 'Passwort anzeigen',
      togglePw: () => this.setState({ show: !show })
    };
  }
}
</script>
</body>
</html>
