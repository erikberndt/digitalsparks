<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernreise – Phasen-Tabs, Tablet quer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#C9B6FF}a:hover{color:#E2D8FF}
</style>
</helmet>
<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Manrope', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="30">
<span style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.r}}px; height: {{s.r}}px; border-radius: 50%; background: #FFFFFF; opacity: {{s.o}}"></span>
</sc-for>
</div>

<header style="position: relative; display: grid; grid-template-columns: 300px 1fr 300px; align-items: center; gap: 24px; padding: 24px 40px 0">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Team [Teamname]</span>
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.1">Climate CO<span style="font-size: 0.6em; vertical-align: -0.3em">2</span>llaboration</h1>
</div>
<nav aria-label="Phasen" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; justify-self: center; width: 520px">
<button onClick="{{tabs.intro.pick}}" aria-current="{{tabs.intro.current}}" style="display: flex; flex-direction: column; gap: 8px; min-height: 52px; padding: 10px 0 0; background: none; border: none; color: {{tabs.intro.color}}; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer"><span style="display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22V4"></path><path d="M5 4h12l-2.5 4L17 12H5"></path></svg>Intro</span><span style="height: 3px; border-radius: 2px; background: {{tabs.intro.bar}}"></span></button>
<button onClick="{{tabs.discover.pick}}" aria-current="{{tabs.discover.current}}" style="display: flex; flex-direction: column; gap: 8px; min-height: 52px; padding: 10px 0 0; background: none; border: none; color: {{tabs.discover.color}}; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer"><span style="display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg>Discover</span><span style="height: 3px; border-radius: 2px; background: {{tabs.discover.bar}}"></span></button>
<button onClick="{{tabs.create.pick}}" aria-current="{{tabs.create.current}}" style="display: flex; flex-direction: column; gap: 8px; min-height: 52px; padding: 10px 0 0; background: none; border: none; color: {{tabs.create.color}}; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer"><span style="display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>Create</span><span style="height: 3px; border-radius: 2px; background: {{tabs.create.bar}}"></span></button>
<button onClick="{{tabs.share.pick}}" aria-current="{{tabs.share.current}}" style="display: flex; flex-direction: column; gap: 8px; min-height: 52px; padding: 10px 0 0; background: none; border: none; color: {{tabs.share.color}}; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer"><span style="display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>Share</span><span style="height: 3px; border-radius: 2px; background: {{tabs.share.bar}}"></span></button>
</nav>
<div></div>
</header>

<main style="position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 48px; padding: 56px 40px 140px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600; color: #A3A3A3">Phase {{phaseNum}} von 4 · {{countLabel}}</span>
<h2 style="margin: 0; font-size: 76px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">{{phaseName}}</h2>
<sc-if value="{{hasNext}}" hint-placeholder-val="{{ true }}">
<button onClick="{{goNext}}" style="margin-top: 22px; align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 999px; background: none; border: 1px solid #3A3A3A; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Weiter zu {{nextName}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button>
</sc-if>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-content: start; overflow-y: auto">
<sc-for list="{{modules}}" as="m" hint-placeholder-count="4">
<button style="display: flex; flex-direction: column; justify-content: space-between; gap: 22px; min-height: 172px; padding: 22px; border-radius: 26px; background: {{m.bg}}; border: 1px solid {{m.border}}; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer">
<span style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%">
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 48px; line-height: 1; color: {{m.numColor}}">{{m.num}}</span>
<span style="width: 44px; height: 44px; border-radius: 50%; background: {{m.goBg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span>
</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 21px; font-weight: 700; line-height: 1.25">{{m.title}}</span>
<sc-if value="{{m.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; font-weight: 600; color: #BDBDBD">{{m.sub}}</span></sc-if>
</span>
</button>
</sc-for>
</div>
</main>

<nav aria-label="Werkzeuge" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); width: 560px; height: 76px; border-radius: 38px; background: #141414; border: 1px solid #2E2E2E; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"></path><path d="M14 10V4a2 2 0 0 0-4 0v2"></path><path d="M10 10.5V6a2 2 0 0 0-4 0v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"></path></svg>Klasse</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg>Optionen</button>
<div style="display: flex; justify-content: center">
<button aria-label="Spark" style="width: 64px; height: 64px; margin-top: -32px; border-radius: 50%; border: 4px solid #000000; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 15.5a2 2 0 0 0-1.4-1.4l-6.1-1.6a.5.5 0 0 1 0-1l6.1-1.6a2 2 0 0 0 1.4-1.4l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path></svg></button>
</div>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>Handbuch</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>Verlassen</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E44D9","options":["#6E44D9","#1F6FEB","#C2410C","#0F766E"]},"startPhase":{"editor":"enum","default":"discover","options":["intro","discover","create","share"]},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  makeStars(seed, count, w, h) {
    let s = seed;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const out = [];
    for (let i = 0; i < count; i++) {
      const big = r() > 0.88;
      out.push({ x: Math.round(r() * w), y: Math.round(r() * h), r: big ? 3 : (r() > 0.5 ? 2 : 1), o: (0.2 + r() * 0.6).toFixed(2) });
    }
    return out;
  }
  renderVals() {
    const accent = this.props.accent ?? '#6E44D9';
    const order = ['intro', 'discover', 'create', 'share'];
    const names = { intro: 'Intro', discover: 'Discover', create: 'Create', share: 'Share' };
    const data = {
      intro: [{ num: 'Hi', title: 'Überblick & Teamname', sub: '5 Minuten · gerade aktiv', active: true }],
      discover: [
        { num: '01', title: 'Der Klimawandel' },
        { num: '02', title: 'Klimagerechtigkeit' },
        { num: '03', title: 'Die Denkweise der Gegenwart' },
        { num: '04', title: 'Alternative Zukünfte' }
      ],
      create: [
        { num: '05', title: 'Ideenfindung' },
        { num: '06', title: 'Projektstart' },
        { num: '07', title: 'Projektabschluss' }
      ],
      share: [{ num: '08', title: 'Ergebnisse teilen' }]
    };
    const st = this.state || {};
    const phase = st.phase ?? (this.props.startPhase ?? 'discover');
    const idx = order.indexOf(phase);
    const tabs = {};
    order.forEach((k, i) => {
      tabs[k] = {
        pick: () => this.setState({ phase: k }),
        current: k === phase ? 'page' : 'false',
        color: k === phase ? '#FFFFFF' : '#A3A3A3',
        bar: k === phase ? accent : (i < idx ? '#5A5A5A' : '#262626')
      };
    });
    const mods = data[phase].map((m) => ({
      ...m,
      hasSub: !!m.sub,
      bg: m.active ? '#1A1528' : '#121212',
      border: m.active ? accent : '#2E2E2E',
      numColor: m.active ? '#C9B6FF' : '#8A8A8A',
      goBg: m.active ? accent : '#262626'
    }));
    const n = mods.length;
    const next = order[idx + 1];
    return {
      accent,
      stars: this.makeStars(33, 70, 1180, 820),
      tabs,
      phaseNum: idx + 1,
      phaseName: names[phase],
      countLabel: n + (n === 1 ? ' Modul' : ' Module'),
      modules: mods,
      hasNext: !!next,
      nextName: next ? names[next] : '',
      goNext: () => { if (next) this.setState({ phase: next }); }
    };
  }
}
</script>
</body>
</html>
