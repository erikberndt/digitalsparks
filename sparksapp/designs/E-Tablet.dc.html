<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernreise – Bestand, Tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#C9B6FF}a:hover{color:#E2D8FF}
</style>
</helmet>
<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Manrope', 'Helvetica Neue', system-ui, sans-serif">
<h1 style="position: absolute; left: 32px; top: 22px; margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 54px; line-height: 1.1; letter-spacing: -0.01em">Climate CO<span style="font-size: 0.55em; vertical-align: -0.35em">2</span>llaboration</h1>

<div style="position: absolute; left: 32px; top: 106px; width: 1116px; height: 690px; box-sizing: border-box; border: 1.5px solid #3A3A3A; border-radius: 48px; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="30">
<span style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.r}}px; height: {{s.r}}px; border-radius: 50%; background: #FFFFFF; opacity: {{s.o}}"></span>
</sc-for>
</div>

<div style="position: absolute; left: 62px; top: 64px; width: 460px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 28px; font-weight: 700">Intro</h2>
<div style="display: flex"><button onClick="{{hiChip.pick}}" aria-pressed="{{hiChip.pressed}}" style="padding: 6px 14px; border-radius: 999px; border: 1px solid {{accent}}; background: {{hiChip.bg}}; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Hi</button></div>

<div style="margin-top: 14px; display: flex; align-items: center; gap: 20px"><span style="width: 50px; height: 50px; box-sizing: border-box; border-radius: 50%; background: #141414; border: 1px solid #333333; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg></span><h2 style="margin: 0; font-size: 30px; font-weight: 700">Discover</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px 12px">
<sc-for list="{{chips.discover}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>

<div style="margin-top: 14px; display: flex; align-items: center; gap: 20px"><span style="width: 50px; height: 50px; box-sizing: border-box; border-radius: 50%; background: #141414; border: 1px solid #333333; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></span><h2 style="margin: 0; font-size: 30px; font-weight: 700">Create</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px 12px">
<sc-for list="{{chips.create}}" as="c" hint-placeholder-count="3">
<button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>

<div style="margin-top: 14px; display: flex; align-items: center; gap: 20px"><span style="width: 50px; height: 50px; box-sizing: border-box; border-radius: 50%; background: #141414; border: 1px solid #333333; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg></span><h2 style="margin: 0; font-size: 30px; font-weight: 700">Share</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px 12px">
<sc-for list="{{chips.share}}" as="c" hint-placeholder-count="1">
<button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>

<section aria-label="Unterkapitel" style="position: absolute; left: 580px; top: 64px; width: 470px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{showHead}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">{{selPhase}}</span>
<h3 style="margin: 0; font-size: 26px; font-weight: 700">{{selTitle}}</h3>
</div>
</sc-if>
<sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
<button style="display: flex; align-items: center; gap: 16px; padding: 8px; box-sizing: border-box; border-radius: 32px; background: #262626; border: 1px solid #3A3A3A; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer">
<span style="width: 50px; height: 50px; flex-shrink: 0; border-radius: 24px; background: #6B6B6B; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">{{st.t}}</span>
<span style="font-size: 18px; font-weight: 600">{{st.title}}</span>
</button>
</sc-for>
</section>
</div>

<nav aria-label="Werkzeuge" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: 500px; height: 82px; box-sizing: border-box; border-radius: 41px; background: #111111; border: 1.5px solid #3A3A3A; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<button style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 15.5a2 2 0 0 0-1.4-1.4l-6.1-1.6a.5.5 0 0 1 0-1l6.1-1.6a2 2 0 0 0 1.4-1.4l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path></svg>Spark</button>
<button style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"></path><path d="M14 10V4a2 2 0 0 0-4 0v2"></path><path d="M10 10.5V6a2 2 0 0 0-4 0v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"></path></svg>Klasse</button>
<button style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg>Optionen</button>
<button style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>Handbuch</button>
<button style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>Verlassen</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E44D9","options":["#6E44D9","#1F6FEB","#C2410C","#0F766E"]},"openChapter":{"editor":"enum","default":"hi","options":["hi","1","2","3","4","5","6","7","8"]},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  makeStars(seed, count, w, h) {
    let s = seed;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const out = [];
    for (let i = 0; i < count; i++) {
      const big = r() > 0.88;
      out.push({ x: Math.round(r() * w), y: Math.round(r() * h), r: big ? 3 : (r() > 0.5 ? 2 : 1), o: (0.2 + r() * 0.6).toFixed(2) });
    }
    return out;
  }
  renderVals() {
    const accent = this.props.accent ?? '#6E44D9';
    const chapters = [
      { id: '1', label: '1. Der Klimawandel', phase: 'discover' },
      { id: '2', label: '2. Klimagerechtigkeit', phase: 'discover' },
      { id: '3', label: '3. Die Denkweise der Gegenwart', phase: 'discover' },
      { id: '4', label: '4. Alternative Zukünfte', phase: 'discover' },
      { id: '5', label: '5. Ideenfindung', phase: 'create' },
      { id: '6', label: '6. Projektstart', phase: 'create' },
      { id: '7', label: '7. Projektabschluss', phase: 'create' },
      { id: '8', label: '8. Ergebnisse teilen', phase: 'share' }
    ];
    const names = { discover: 'Discover', create: 'Create', share: 'Share' };
    const st = this.state || {};
    const sel = st.sel ?? (this.props.openChapter ?? 'hi');
    const chips = { discover: [], create: [], share: [] };
    chapters.forEach((c) => {
      const on = c.id === sel;
      chips[c.phase].push({ label: c.label, pick: () => this.setState({ sel: c.id }), pressed: String(on), bg: on ? accent : '#141414', border: on ? accent : '#3A3A3A' });
    });
    const cur = chapters.find((c) => c.id === sel);
    const steps = cur
      ? [1, 2, 3, 4].map((n) => ({ t: '–\'', title: '[Unterkapitel ' + cur.id + '.' + n + ']' }))
      : [{ t: '5\'', title: 'Überblick & Teamname' }];
    return {
      accent,
      stars: this.makeStars(3, 70, 1116, 690),
      chips,
      hiChip: { pick: () => this.setState({ sel: 'hi' }), pressed: String(sel === 'hi'), bg: sel === 'hi' ? accent : '#141414' },
      showHead: !!cur,
      selPhase: cur ? names[cur.phase] : '',
      selTitle: cur ? cur.label : '',
      steps
    };
  }
}
</script>
</body>
</html>
