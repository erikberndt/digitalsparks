<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Anmelden (Web, mobil)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#C9B6FF}a:hover{color:#E2D8FF}
input::placeholder{color:#8A8A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Manrope', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; padding: 0 20px; box-sizing: border-box">

<div style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding-top: 8px">
<a href="F1-Landing.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m11 18-6-6 6-6"></path></svg></a>
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 20px">Digital Sparks</span>
<span style="width: 34px"></span>
</div>

<h1 style="margin: 20px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 46px; line-height: 1.05; letter-spacing: -0.01em">Willkommen zurück</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 1.45; color: #BDBDBD">Melde dich an, um deinen Spark anzulegen.</p>

<div role="group" aria-label="Ich bin" style="margin-top: 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #161616; border: 1px solid #2A2A2A">
<button onClick="{{pickTeacher}}" aria-pressed="{{teacherPressed}}" style="min-height: 44px; border-radius: 999px; border: none; background: {{teacherBg}}; color: {{teacherColor}}; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Lehrer*in</button>
<button onClick="{{pickStudent}}" aria-pressed="{{studentPressed}}" style="min-height: 44px; border-radius: 999px; border: none; background: {{studentBg}}; color: {{studentColor}}; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Schüler*in</button>
</div>

<div style="margin-top: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="login-email" style="font-size: 14px; font-weight: 700">E-Mail</label>
<input id="login-email" type="email" autocomplete="email" inputmode="email" placeholder="name@schule.de" style="height: 54px; padding: 0 16px; border-radius: 16px; border: 1px solid #3A3A3A; background: #161616; color: #FFFFFF; font: inherit; font-size: 16px; outline-color: {{accent}}">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><label for="login-pw" style="font-size: 14px; font-weight: 700">Passwort</label><a href="#" style="font-size: 14px; font-weight: 700">Vergessen?</a></div>
<div style="position: relative">
<input id="login-pw" type="{{pwType}}" autocomplete="current-password" placeholder="Dein Passwort" style="width: 100%; box-sizing: border-box; height: 54px; padding: 0 56px 0 16px; border-radius: 16px; border: 1px solid #3A3A3A; background: #161616; color: #FFFFFF; font: inherit; font-size: 16px; outline-color: {{accent}}">
<button onClick="{{togglePw}}" aria-label="{{pwLabel}}" style="position: absolute; right: 5px; top: 5px; width: 44px; height: 44px; border-radius: 12px; border: none; background: none; color: #BDBDBD; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
</div>

<button style="margin-top: 26px; min-height: 56px; border-radius: 999px; border: none; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer">Anmelden</button>

<div style="margin-top: auto; margin-bottom: 34px; padding: 18px; border-radius: 22px; background: #121212; border: 1px solid #262626; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 800">Neu bei Digital Sparks?</span>
<span style="font-size: 14px; font-weight: 600; color: #BDBDBD">Kostenlose, spendenfinanzierte Lernreisen für deine Klasse.</span>
</div>
<a href="F3-Registrieren.dc.html" style="min-height: 52px; border-radius: 999px; border: 1px solid #5A5A5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; text-decoration: none">Kostenlos registrieren</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E44D9","options":["#6E44D9","#1F6FEB","#C2410C","#0F766E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const role = st.role ?? 'teacher';
    const show = st.show ?? false;
    const t = role === 'teacher';
    return {
      accent: this.props.accent ?? '#6E44D9',
      pickTeacher: () => this.setState({ role: 'teacher' }),
      pickStudent: () => this.setState({ role: 'student' }),
      teacherPressed: String(t), studentPressed: String(!t),
      teacherBg: t ? '#FFFFFF' : 'transparent', teacherColor: t ? '#000000' : '#BDBDBD',
      studentBg: !t ? '#FFFFFF' : 'transparent', studentColor: !t ? '#000000' : '#BDBDBD',
      pwType: show ? 'text' : 'password',
      pwLabel: show ? 'Passwort verbergen' : 'Passwort anzeigen',
      togglePw: () => this.setState({ show: !show })
    };
  }
}
</script>
</body>
</html>
