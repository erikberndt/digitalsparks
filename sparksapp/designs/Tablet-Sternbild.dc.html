<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernreise – Sternbild-Karte, Tablet quer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#C9B6FF}a:hover{color:#E2D8FF}
</style>
</helmet>
<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Manrope', 'Helvetica Neue', system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="30">
<span style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.r}}px; height: {{s.r}}px; border-radius: 50%; background: #FFFFFF; opacity: {{s.o}}"></span>
</sc-for>
</div>

<header style="position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 0 40px">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.1">Climate CO<span style="font-size: 0.6em; vertical-align: -0.3em">2</span>llaboration</h1>
<div style="display: flex; gap: 8px">
<button style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #333333; background: #111111; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"></path><path d="M14 10V4a2 2 0 0 0-4 0v2"></path><path d="M10 10.5V6a2 2 0 0 0-4 0v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"></path></svg>Klasse</button>
<button style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #333333; background: #111111; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>Verlassen</button>
</div>
</header>

<sc-for list="{{brackets}}" as="b" hint-placeholder-count="4">
<span style="position: absolute; left: {{b.left}}px; top: 186px; width: {{b.width}}px; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{b.color}}">{{b.name}}</span>
<span aria-hidden="true" style="position: absolute; left: {{b.left}}px; top: 212px; width: {{b.width}}px; height: 2px; border-radius: 1px; background: {{b.line}}"></span>
</sc-for>

<svg aria-hidden="true" width="800" height="820" viewBox="0 0 800 820" style="position: absolute; left: 0; top: 0; pointer-events: none"><polyline points="{{linePoints}}" fill="none" stroke="#3A3A3A" stroke-width="1.5" stroke-dasharray="4 6"></polyline></svg>

<sc-for list="{{nodes}}" as="n" hint-placeholder-count="9">
<button onClick="{{n.pick}}" aria-label="{{n.aria}}" aria-pressed="{{n.pressed}}" style="position: absolute; left: {{n.left}}px; top: {{n.top}}px; width: 52px; height: 52px; border-radius: 50%; padding: 0; background: {{n.bg}}; border: 1px solid {{n.border}}; box-shadow: {{n.ring}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer">{{n.num}}</button>
<span style="position: absolute; left: {{n.labelLeft}}px; top: {{n.labelTop}}px; width: 130px; text-align: center; font-size: 13px; font-weight: 700; line-height: 1.3; color: {{n.labelColor}}; pointer-events: none">{{n.title}}</span>
</sc-for>

<section aria-label="Ausgewähltes Modul" style="position: absolute; left: 820px; right: 20px; top: 92px; bottom: 20px; box-sizing: border-box; padding: 30px 28px 28px; border-radius: 30px; background: #121212; border: 1px solid #2E2E2E; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">{{selPhase}} · {{selCount}}</span>
<h2 style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em">{{selTitle}}</h2>
</div>
<sc-if value="{{selHasStep}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 18px; background: #1E1E1E">
<span style="width: 48px; height: 48px; border-radius: 14px; background: #3A3A3A; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">5'</span>
<span style="font-size: 16px; font-weight: 700">Überblick &amp; Teamname</span>
</div>
</sc-if>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<button style="min-height: 58px; border-radius: 999px; border: none; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>Starten</button>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 68px; border-radius: 18px; border: 1px solid #333333; background: #1A1A1A; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9B6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 15.5a2 2 0 0 0-1.4-1.4l-6.1-1.6a.5.5 0 0 1 0-1l6.1-1.6a2 2 0 0 0 1.4-1.4l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path></svg>Spark</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 68px; border-radius: 18px; border: 1px solid #333333; background: #1A1A1A; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg>Optionen</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 68px; border-radius: 18px; border: 1px solid #333333; background: #1A1A1A; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>Handbuch</button>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E44D9","options":["#6E44D9","#1F6FEB","#C2410C","#0F766E"]},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  makeStars(seed, count, w, h) {
    let s = seed;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const out = [];
    for (let i = 0; i < count; i++) {
      const big = r() > 0.85;
      out.push({ x: Math.round(r() * w), y: Math.round(r() * h), r: big ? 3 : (r() > 0.5 ? 2 : 1), o: (0.2 + r() * 0.6).toFixed(2) });
    }
    return out;
  }
  renderVals() {
    const accent = this.props.accent ?? '#6E44D9';
    const ys = [330, 540, 310, 580, 350, 520, 300, 560, 370];
    const base = [
      { num: 'Hi', title: 'Intro', phase: 'Intro' },
      { num: '1', title: 'Der Klimawandel', phase: 'Discover' },
      { num: '2', title: 'Klimagerechtigkeit', phase: 'Discover' },
      { num: '3', title: 'Die Denkweise der Gegenwart', phase: 'Discover' },
      { num: '4', title: 'Alternative Zukünfte', phase: 'Discover' },
      { num: '5', title: 'Ideenfindung', phase: 'Create' },
      { num: '6', title: 'Projektstart', phase: 'Create' },
      { num: '7', title: 'Projektabschluss', phase: 'Create' },
      { num: '8', title: 'Ergebnisse teilen', phase: 'Share' }
    ];
    const mods = base.map((m, i) => ({ ...m, x: 84 + i * 82, y: ys[i] }));
    const st = this.state || {};
    const sel = st.sel ?? 0;
    const cur = mods[sel];
    const nodes = mods.map((m, i) => {
      const isSel = i === sel;
      const isNow = i === 0;
      return {
        num: m.num,
        title: m.title,
        aria: m.phase + ': ' + m.title,
        pressed: String(isSel),
        pick: () => this.setState({ sel: i }),
        left: m.x - 26,
        top: m.y - 26,
        bg: isSel ? accent : (isNow ? '#1A1528' : '#141414'),
        border: isSel || isNow ? accent : '#3A3A3A',
        ring: isSel ? '0 0 0 7px rgba(110, 68, 217, 0.28)' : 'none',
        labelLeft: m.x - 65,
        labelTop: m.y + 36,
        labelColor: isSel ? '#FFFFFF' : '#BDBDBD'
      };
    });
    const groups = ['Intro', 'Discover', 'Create', 'Share'];
    const brackets = groups.map((g) => {
      const xs = mods.filter((m) => m.phase === g).map((m) => m.x);
      const left = Math.min(...xs) - 34;
      const width = Math.max(...xs) - Math.min(...xs) + 68;
      const on = g === cur.phase;
      return { name: g, left, width, color: on ? '#FFFFFF' : '#A3A3A3', line: on ? accent : '#2E2E2E' };
    });
    return {
      accent,
      stars: this.makeStars(5, 70, 800, 820),
      linePoints: mods.map((m) => m.x + ',' + m.y).join(' '),
      nodes,
      brackets,
      selPhase: cur.phase,
      selCount: sel === 0 ? 'Start' : 'Modul ' + cur.num + ' von 8',
      selTitle: sel === 0 ? 'Hi – willkommen' : cur.title,
      selHasStep: sel === 0
    };
  }
}
</script>
</body>
</html>
