<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernreise – Pfad, Tablet quer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#C9B6FF}a:hover{color:#E2D8FF}
</style>
</helmet>
<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Manrope', 'Helvetica Neue', system-ui, sans-serif; display: flex">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="30">
<span style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.r}}px; height: {{s.r}}px; border-radius: 50%; background: #FFFFFF; opacity: {{s.o}}"></span>
</sc-for>
</div>

<aside style="position: relative; width: 400px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; background: #0A0A0A; border-right: 1px solid #222222">
<div style="padding: 28px 28px 0; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.1; letter-spacing: -0.01em">Climate CO<span style="font-size: 0.6em; vertical-align: -0.3em">2</span>llaboration</h1>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #A3A3A3"><span>Deine Lernreise</span><span>0 von 8 Modulen</span></div>
<div style="height: 4px; border-radius: 2px; background: #262626"><div style="width: 6%; height: 4px; border-radius: 2px; background: {{accent}}"></div></div>
</div>
</div>

<nav aria-label="Module" style="position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 22px 28px 28px">
<div style="position: relative; display: flex; flex-direction: column; gap: 14px">
<div aria-hidden="true" style="position: absolute; left: 17px; top: 20px; bottom: 20px; width: 2px; background: #262626"></div>

<section style="position: relative; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 12px; min-height: 36px">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22V4"></path><path d="M5 4h12l-2.5 4L17 12H5"></path></svg></span>
<h2 style="margin: 0; flex: 1; font-size: 20px; font-weight: 800">Intro</h2>
</div>
<sc-for list="{{rows.intro}}" as="m" hint-placeholder-count="1">
<button onClick="{{m.pick}}" aria-current="{{m.current}}" style="margin-left: 48px; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px; border-radius: 14px; background: {{m.bg}}; border: 1px solid {{m.border}}; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="min-width: 22px; font-size: 13px; font-weight: 700; color: {{m.numColor}}">{{m.num}}</span><span style="flex: 1; font-size: 14px; font-weight: 700">{{m.title}}</span></button>
</sc-for>
</section>

<section style="position: relative; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 12px; min-height: 36px">
<span style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #141414; border: 1px solid #333333; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg></span>
<h2 style="margin: 0; flex: 1; font-size: 20px; font-weight: 800">Discover</h2>
</div>
<sc-for list="{{rows.discover}}" as="m" hint-placeholder-count="4">
<button onClick="{{m.pick}}" aria-current="{{m.current}}" style="margin-left: 48px; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px; border-radius: 14px; background: {{m.bg}}; border: 1px solid {{m.border}}; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="min-width: 22px; font-size: 13px; font-weight: 700; color: {{m.numColor}}">{{m.num}}</span><span style="flex: 1; font-size: 14px; font-weight: 700">{{m.title}}</span></button>
</sc-for>
</section>

<section style="position: relative; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 12px; min-height: 36px">
<span style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #141414; border: 1px solid #333333; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></span>
<h2 style="margin: 0; flex: 1; font-size: 20px; font-weight: 800">Create</h2>
</div>
<sc-for list="{{rows.create}}" as="m" hint-placeholder-count="3">
<button onClick="{{m.pick}}" aria-current="{{m.current}}" style="margin-left: 48px; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px; border-radius: 14px; background: {{m.bg}}; border: 1px solid {{m.border}}; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="min-width: 22px; font-size: 13px; font-weight: 700; color: {{m.numColor}}">{{m.num}}</span><span style="flex: 1; font-size: 14px; font-weight: 700">{{m.title}}</span></button>
</sc-for>
</section>

<section style="position: relative; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 12px; min-height: 36px">
<span style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #141414; border: 1px solid #333333; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg></span>
<h2 style="margin: 0; flex: 1; font-size: 20px; font-weight: 800">Share</h2>
</div>
<sc-for list="{{rows.share}}" as="m" hint-placeholder-count="1">
<button onClick="{{m.pick}}" aria-current="{{m.current}}" style="margin-left: 48px; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px; border-radius: 14px; background: {{m.bg}}; border: 1px solid {{m.border}}; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="min-width: 22px; font-size: 13px; font-weight: 700; color: {{m.numColor}}">{{m.num}}</span><span style="flex: 1; font-size: 14px; font-weight: 700">{{m.title}}</span></button>
</sc-for>
</section>
</div>
</nav>
</aside>

<main style="position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 28px 56px 120px">
<div style="display: flex; justify-content: flex-end">
<button style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #333333; background: #111111; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>Verlassen</button>
</div>

<div style="margin-top: 64px; display: flex; flex-direction: column; gap: 10px; max-width: 620px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">{{selPhase}} · {{selCount}}</span>
<h2 style="margin: 0; font-size: 60px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em">{{selTitle}}</h2>
</div>

<sc-if value="{{selIsIntro}}" hint-placeholder-val="{{ true }}">
<div style="margin-top: 36px; max-width: 620px; display: flex; align-items: center; gap: 18px; padding: 16px; border-radius: 26px; background: #161616; border: 1px solid #2E2E2E">
<div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 18px; background: #3A3A3A; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">5'</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Jetzt dran</span><span style="font-size: 22px; font-weight: 700">Überblick &amp; Teamname</span></div>
</div>
</sc-if>

<div style="margin-top: 32px; display: flex; gap: 12px; align-items: center">
<button style="min-height: 56px; padding: 0 30px; border-radius: 999px; border: none; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 10px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>Starten</button>
<button onClick="{{goPrev}}" aria-label="Vorheriges Modul" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid #333333; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<button onClick="{{goNext}}" aria-label="Nächstes Modul" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid #333333; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>

<nav aria-label="Werkzeuge" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 460px; padding: 8px; box-sizing: border-box; border-radius: 40px; background: #141414; border: 1px solid #2E2E2E">
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C9B6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 15.5a2 2 0 0 0-1.4-1.4l-6.1-1.6a.5.5 0 0 1 0-1l6.1-1.6a2 2 0 0 0 1.4-1.4l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path></svg>Spark</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"></path><path d="M14 10V4a2 2 0 0 0-4 0v2"></path><path d="M10 10.5V6a2 2 0 0 0-4 0v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"></path></svg>Klasse</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg>Optionen</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>Handbuch</button>
</nav>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E44D9","options":["#6E44D9","#1F6FEB","#C2410C","#0F766E"]},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  makeStars(seed, count, w, h) {
    let s = seed;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const out = [];
    for (let i = 0; i < count; i++) {
      const big = r() > 0.88;
      out.push({ x: Math.round(r() * w), y: Math.round(r() * h), r: big ? 3 : (r() > 0.5 ? 2 : 1), o: (0.2 + r() * 0.6).toFixed(2) });
    }
    return out;
  }
  renderVals() {
    const accent = this.props.accent ?? '#6E44D9';
    const mods = [
      { num: 'Hi', title: 'Überblick & Teamname', phase: 'intro' },
      { num: '1', title: 'Der Klimawandel', phase: 'discover' },
      { num: '2', title: 'Klimagerechtigkeit', phase: 'discover' },
      { num: '3', title: 'Die Denkweise der Gegenwart', phase: 'discover' },
      { num: '4', title: 'Alternative Zukünfte', phase: 'discover' },
      { num: '5', title: 'Ideenfindung', phase: 'create' },
      { num: '6', title: 'Projektstart', phase: 'create' },
      { num: '7', title: 'Projektabschluss', phase: 'create' },
      { num: '8', title: 'Ergebnisse teilen', phase: 'share' }
    ];
    const names = { intro: 'Intro', discover: 'Discover', create: 'Create', share: 'Share' };
    const st = this.state || {};
    const sel = st.sel ?? 0;
    const rows = { intro: [], discover: [], create: [], share: [] };
    mods.forEach((m, i) => {
      const on = i === sel;
      rows[m.phase].push({
        num: m.num, title: m.title,
        pick: () => this.setState({ sel: i }),
        current: on ? 'page' : 'false',
        bg: on ? '#1A1528' : '#121212',
        border: on ? accent : '#2A2A2A',
        numColor: on ? '#C9B6FF' : '#A3A3A3'
      });
    });
    const cur = mods[sel];
    return {
      accent,
      stars: this.makeStars(11, 70, 1180, 820),
      rows,
      selPhase: names[cur.phase],
      selCount: sel === 0 ? 'Start' : 'Modul ' + cur.num + ' von 8',
      selTitle: sel === 0 ? 'Hi – willkommen' : cur.title,
      selIsIntro: sel === 0,
      goPrev: () => this.setState({ sel: Math.max(0, sel - 1) }),
      goNext: () => this.setState({ sel: Math.min(mods.length - 1, sel + 1) })
    };
  }
}
</script>
</body>
</html>
