<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernreise – Pfad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#C9B6FF}a:hover{color:#E2D8FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Manrope', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column">

</sc-for>
</div>

<header style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 20px 0">

<button aria-label="Verlassen" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 1px solid #333333; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">

</button>
</header>

<div style="position: relative; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #A3A3A3"><span>Deine Lernreise</span><span>0 von 8 Modulen</span></div>
<div style="height: 4px; border-radius: 2px; background: #262626"><div style="width: 6%; height: 4px; border-radius: 2px; background: {{accent}}"></div></div>
</div>

<div style="position: relative; margin: 16px 20px 0; padding: 12px 12px 12px 14px; border-radius: 22px; background: #161616; border: 1px solid #2E2E2E; display: flex; align-items: center; gap: 14px">
<div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #3A3A3A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px">5'</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3">Jetzt dran · Intro</span>
<span style="font-size: 17px; font-weight: 700">Überblick &amp; Teamname</span>
</div>
<button aria-label="Überblick &amp; Teamname starten" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: none; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
</button>
</div>

<div style="position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 20px 20px 112px">
<div style="position: relative; display: flex; flex-direction: column; gap: 6px">
<div aria-hidden="true" style="position: absolute; left: 21px; top: 24px; bottom: 24px; width: 2px; background: #262626"></div>

<section style="position: relative; display: flex; flex-direction: column; gap: 8px">
<button onClick="{{toggleIntro}}" aria-expanded="{{introExp}}" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0; background: none; border: none; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22V4"></path><path d="M5 4h12l-2.5 4L17 12H5"></path></svg></span>
<span style="flex: 1; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">Intro</span>
<span style="font-size: 13px; font-weight: 600; color: #A3A3A3">1 Modul</span>

<span style="flex: 1; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">Discover</span>
<span style="font-size: 13px; font-weight: 600; color: #A3A3A3">4 Module</span>
<span style="display: flex; color: #A3A3A3; transform: rotate({{rotDiscover}}deg)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
</button>
<sc-if value="{{openDiscover}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 0 10px 58px">
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #121212; border: 1px solid #2E2E2E; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="width: 18px; font-size: 13px; font-weight: 700; color: #A3A3A3">1</span><span style="flex: 1; font-size: 15px; font-weight: 700">Der Klimawandel</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #121212; border: 1px solid #2E2E2E; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="width: 18px; font-size: 13px; font-weight: 700; color: #A3A3A3">2</span><span style="flex: 1; font-size: 15px; font-weight: 700">Klimagerechtigkeit</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #121212; border: 1px solid #2E2E2E; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="width: 18px; font-size: 13px; font-weight: 700; color: #A3A3A3">3</span><span style="flex: 1; font-size: 15px; font-weight: 700">Die Denkweise der Gegenwart</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #121212; border: 1px solid #2E2E2E; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="width: 18px; font-size: 13px; font-weight: 700; color: #A3A3A3">4</span><span style="flex: 1; font-size: 15px; font-weight: 700">Alternative Zukünfte</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
</sc-if>
</section>

<section style="position: relative; display: flex; flex-direction: column; gap: 8px">
<button onClick="{{toggleCreate}}" aria-expanded="{{createExp}}" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0; background: none; border: none; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #141414; border: 1px solid #333333; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></span>
<span style="flex: 1; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">Create</span>
<span style="font-size: 13px; font-weight: 600; color: #A3A3A3">3 Module</span>
<span style="display: flex; color: #A3A3A3; transform: rotate({{rotCreate}}deg)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
</button>
<sc-if value="{{openCreate}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 0 10px 58px">
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #121212; border: 1px solid #2E2E2E; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="width: 18px; font-size: 13px; font-weight: 700; color: #A3A3A3">5</span><span style="flex: 1; font-size: 15px; font-weight: 700">Ideenfindung</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #121212; border: 1px solid #2E2E2E; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="width: 18px; font-size: 13px; font-weight: 700; color: #A3A3A3">6</span><span style="flex: 1; font-size: 15px; font-weight: 700">Projektstart</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #121212; border: 1px solid #2E2E2E; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="width: 18px; font-size: 13px; font-weight: 700; color: #A3A3A3">7</span><span style="flex: 1; font-size: 15px; font-weight: 700">Projektabschluss</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
</sc-if>
</section>

<section style="position: relative; display: flex; flex-direction: column; gap: 8px">
<button onClick="{{toggleShare}}" aria-expanded="{{shareExp}}" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0; background: none; border: none; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #141414; border: 1px solid #333333; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg></span>
<span style="flex: 1; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">Share</span>
<span style="font-size: 13px; font-weight: 600; color: #A3A3A3">1 Modul</span>
<span style="display: flex; color: #A3A3A3; transform: rotate({{rotShare}}deg)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
</button>
<sc-if value="{{openShare}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 0 10px 58px">
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #121212; border: 1px solid #2E2E2E; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="width: 18px; font-size: 13px; font-weight: 700; color: #A3A3A3">8</span><span style="flex: 1; font-size: 15px; font-weight: 700">Ergebnisse teilen</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
</sc-if>

</div>
</div>

<nav aria-label="Werkzeuge" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 26px; background: #0D0D0D; border-top: 1px solid #222222">
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accentLight}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 15.5a2 2 0 0 0-1.4-1.4l-6.1-1.6a.5.5 0 0 1 0-1l6.1-1.6a2 2 0 0 0 1.4-1.4l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path></svg>Spark</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"></path><path d="M14 10V4a2 2 0 0 0-4 0v2"></path><path d="M10 10.5V6a2 2 0 0 0-4 0v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"></path></svg>Klasse</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg>Optionen</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; background: none; border: none; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>Handbuch</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E44D9","options":["#6E44D9","#1F6FEB","#C2410C","#0F766E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  makeStars(seed, count, w, h) {
    let s = seed;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const out = [];
    for (let i = 0; i < count; i++) {
      const big = r() > 0.88;
      out.push({ x: Math.round(r() * w), y: Math.round(r() * h), r: big ? 3 : (r() > 0.5 ? 2 : 1), o: (0.2 + r() * 0.6).toFixed(2) });
    }
    return out;
  }
  renderVals() {
    const st = this.state || {};
    const open = {
      intro: st.intro ?? true,
      discover: st.discover ?? true,
      create: st.create ?? false,
      share: st.share ?? false
    };
    const toggle = (k) => () => this.setState({ [k]: !open[k] });
    return {
      accent: this.props.accent ?? '#6E44D9',
      accentLight: '#C9B6FF',
      stars: this.makeStars(7, 48, 390, 844),
      openIntro: open.intro, openDiscover: open.discover, openCreate: open.create, openShare: open.share,
      introExp: String(open.intro), discoverExp: String(open.discover), createExp: String(open.create), shareExp: String(open.share),
      rotIntro: open.intro ? 180 : 0, rotDiscover: open.discover ? 180 : 0, rotCreate: open.create ? 180 : 0, rotShare: open.share ? 180 : 0,
      toggleIntro: toggle('intro'), toggleDiscover: toggle('discover'), toggleCreate: toggle('create'), toggleShare: toggle('share')
    };
  }
}
</script>
</body>
</html>
